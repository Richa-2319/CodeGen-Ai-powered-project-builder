<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-label="06  Generated files: Kafka, MinIO and acknowledgement"><title>06  Generated files: Kafka, MinIO and acknowledgement</title><desc>A saga ID joins one file-edit event to its storage result. No transactional outbox or cross-store transaction: a crash can leave partial progress. The acknowledgement is not sent on the original SSE stream.</desc><rect width="100%" height="100%" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60778c" /></marker><marker id="async-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b78222" /></marker></defs><text x="60" y="61" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#23364b" text-anchor="start">06  Generated files: Kafka, MinIO and acknowledgement</text><text x="60" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526278" text-anchor="start">A saga ID joins one file-edit event to its storage result.</text><polyline points="380,245.0 440,245.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="760,245.0 820,245.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="980.0,330 980.0,415" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="820,500.0 760,500.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="440,500.0 380,500.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="220.0,585 220.0,670" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="380,755.0 440,755.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="760,755.0 820,755.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="60" y="160" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="78" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">01 Parse completed edits</text><text x="78" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Create FILE_EDIT chat</text><text x="78" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">events and a unique saga ID</text><text x="78" y="289" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">for each file.</text><rect x="440" y="160" width="320" height="170" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="458" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">02 Commit tracking first</text><text x="458" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Persist PENDING events in</text><text x="458" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">the intelligence database</text><text x="458" y="289" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">before publishing.</text><rect x="820" y="160" width="320" height="170" rx="14" fill="#fff5dd" stroke="#b78222" stroke-width="1.8" /><text x="838" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">03 Send a Kafka request</text><text x="838" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Topic:</text><text x="838" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">file-storage-request-event;</text><text x="838" y="289" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">partition key: project ID.</text><rect x="820" y="415" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="838" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">04 Consume in</text><text x="838" y="484" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Workspace</text><text x="838" y="517" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">If sagaId is already processed, skip</text><text x="838" y="540" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">the write and resend success.</text><rect x="440" y="415" width="320" height="170" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="458" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">05 Write the object</text><text x="458" y="492" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Save the file under</text><text x="458" y="518" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">projectId/path in the MinIO</text><text x="458" y="544" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">projects bucket.</text><rect x="60" y="415" width="320" height="170" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="78" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">06 Commit file metadata</text><text x="78" y="492" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Save project_files, then</text><text x="78" y="518" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">processed_events for</text><text x="78" y="544" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">duplicate detection.</text><rect x="60" y="670" width="320" height="170" rx="14" fill="#fff5dd" stroke="#b78222" stroke-width="1.8" /><text x="78" y="711" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">07 Send</text><text x="78" y="739" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">acknowledgement</text><text x="78" y="772" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">Topic: file-store-responses. Failed</text><text x="78" y="795" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">ACK sends surface for a retry.</text><rect x="440" y="670" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="458" y="711" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">08 Resolve the chat event</text><text x="458" y="747" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Intelligence matches sagaId</text><text x="458" y="773" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">and sets CONFIRMED or</text><text x="458" y="799" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">FAILED.</text><rect x="820" y="670" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="838" y="711" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">09 Read saved content</text><text x="838" y="747" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">A later file or preview request</text><text x="838" y="773" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">reads stored metadata and</text><text x="838" y="799" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">object bytes.</text><line x1="60" y1="945" x2="1140" y2="945" stroke="#dde4ec" /><text x="60" y="979" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">No transactional outbox or cross-store transaction: a crash can leave partial progress. The acknowledgement is not sent on the original</text><text x="60" y="1002" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">SSE stream.</text></svg>