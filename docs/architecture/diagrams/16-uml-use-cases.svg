<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="1450" viewBox="0 0 2220 1450" role="img" aria-label="16  UML use cases: actors, capabilities and role inheritance"><title>16  UML use cases: actors, capabilities and role inheritance</title><desc>Component dataflow with labeled directional connectors. See the accompanying microservice dataflow guide for payload and source details.</desc><rect width="100%" height="100%" fill="#FFFFFF" /><defs><marker id="arrow3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3878C5" /></marker><marker id="open3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#3878C5" /></marker><marker id="arrow25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25866B" /></marker><marker id="open25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#25866B" /></marker><marker id="arrow8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8461B3" /></marker><marker id="open8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#8461B3" /></marker><marker id="arrowB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B78222" /></marker><marker id="openB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#B78222" /></marker></defs><rect x="390" y="190" width="1390" height="1190" fill="#FBFCFE" stroke="#B7C3D1" stroke-width="2" stroke-dasharray="8 5" /><text x="406" y="223" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#536479">CodeGen application</text><polyline points="330,365.0 410,365 410,335 480,335.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" /><polyline points="330,365.0 370,365 370,525 480,525.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" /><polyline points="310,845.0 480,845.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" /><polyline points="310,845.0 360,845 360,1065 480,1065.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" /><polyline points="1880,350.0 1670,350.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" /><polyline points="1880,680.0 1670,680.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" /><polyline points="1880,1090.0 1815,1090 1815,1055 1670,1055.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" /><polyline points="1880,1090.0 1835,1090 1835,1245 1670,1245.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" /><polyline points="2000.0,570 2000.0,460" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#open3878C5)" /><polyline points="2000.0,980 2000.0,790" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#open3878C5)" /><circle cx="210.0" cy="277" r="20" fill="#FFFFFF" stroke="#3878C5" stroke-width="3" /><line x1="210.0" y1="297" x2="210.0" y2="358" stroke="#3878C5" stroke-width="3" /><line x1="173.0" y1="318" x2="247.0" y2="318" stroke="#3878C5" stroke-width="3" /><line x1="210.0" y1="358" x2="176.0" y2="397" stroke="#3878C5" stroke-width="3" /><line x1="210.0" y1="358" x2="244.0" y2="397" stroke="#3878C5" stroke-width="3" /><text x="98" y="432" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Visitor</text><circle cx="190.0" cy="757" r="20" fill="#FFFFFF" stroke="#3878C5" stroke-width="3" /><line x1="190.0" y1="777" x2="190.0" y2="838" stroke="#3878C5" stroke-width="3" /><line x1="153.0" y1="798" x2="227.0" y2="798" stroke="#3878C5" stroke-width="3" /><line x1="190.0" y1="838" x2="156.0" y2="877" stroke="#3878C5" stroke-width="3" /><line x1="190.0" y1="838" x2="224.0" y2="877" stroke="#3878C5" stroke-width="3" /><text x="78" y="912" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Signed-in user</text><circle cx="2000.0" cy="262" r="20" fill="#FFFFFF" stroke="#3878C5" stroke-width="3" /><line x1="2000.0" y1="282" x2="2000.0" y2="343" stroke="#3878C5" stroke-width="3" /><line x1="1963.0" y1="303" x2="2037.0" y2="303" stroke="#3878C5" stroke-width="3" /><line x1="2000.0" y1="343" x2="1966.0" y2="382" stroke="#3878C5" stroke-width="3" /><line x1="2000.0" y1="343" x2="2034.0" y2="382" stroke="#3878C5" stroke-width="3" /><text x="1888" y="417" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Viewer</text><circle cx="2000.0" cy="592" r="20" fill="#FFFFFF" stroke="#3878C5" stroke-width="3" /><line x1="2000.0" y1="612" x2="2000.0" y2="673" stroke="#3878C5" stroke-width="3" /><line x1="1963.0" y1="633" x2="2037.0" y2="633" stroke="#3878C5" stroke-width="3" /><line x1="2000.0" y1="673" x2="1966.0" y2="712" stroke="#3878C5" stroke-width="3" /><line x1="2000.0" y1="673" x2="2034.0" y2="712" stroke="#3878C5" stroke-width="3" /><text x="1888" y="747" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Editor</text><circle cx="2000.0" cy="1002" r="20" fill="#FFFFFF" stroke="#3878C5" stroke-width="3" /><line x1="2000.0" y1="1022" x2="2000.0" y2="1083" stroke="#3878C5" stroke-width="3" /><line x1="1963.0" y1="1043" x2="2037.0" y2="1043" stroke="#3878C5" stroke-width="3" /><line x1="2000.0" y1="1083" x2="1966.0" y2="1122" stroke="#3878C5" stroke-width="3" /><line x1="2000.0" y1="1083" x2="2034.0" y2="1122" stroke="#3878C5" stroke-width="3" /><text x="1888" y="1157" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Owner</text><ellipse cx="720.0" cy="335.0" rx="240.0" ry="55.0" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="631.0" y="344.5" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Sign up / log in</text><ellipse cx="720.0" cy="525.0" rx="240.0" ry="55.0" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="604.0" y="534.5" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">View published app</text><ellipse cx="720.0" cy="855.0" rx="240.0" ry="55.0" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="600.5" y="864.5" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Create / list projects</text><ellipse cx="720.0" cy="1065.0" rx="240.0" ry="55.0" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="595.5" y="1074.5" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Read plan and usage</text><ellipse cx="1425.0" cy="355.0" rx="245.0" ry="55.0" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="1269.5" y="364.5" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Read / preview / download</text><ellipse cx="1425.0" cy="685.0" rx="245.0" ry="55.0" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="1292.5" y="694.5" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Edit / generate / delete</text><ellipse cx="1425.0" cy="1055.0" rx="245.0" ry="55.0" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="1274.5" y="1064.5" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Manage project members</text><ellipse cx="1425.0" cy="1245.0" rx="245.0" ry="55.0" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="1310.5" y="1254.5" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Publish / unpublish</text><text x="66" y="74" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#203247">16 UML use cases: actors, capabilities and role inheritance</text><text x="66" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Roles apply within one project. The hollow triangle points to the role whose capabilities are inherited.</text><text x="2046" y="517" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">inherits</text><text x="2046" y="890" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">inherits</text><text x="491" y="646" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Read access includes saved files, preview bundles, ZIP</text><text x="491" y="674" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">downloads and member lists. Sharing grants an existing</text><text x="491" y="702" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">user membership immediately; there is no invitation</text><text x="491" y="730" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">acceptance flow.</text><text x="491" y="1196" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Create and usage actions require login. Creating a project</text><text x="491" y="1224" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">establishes the caller as OWNER. Editor deletion is</text><text x="491" y="1252" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">implemented behavior; only OWNER manages members or</text><text x="491" y="1280" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">publication.</text><text x="76" y="1425" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#536479">Grouped use cases keep this overview readable. The permission table and controller source links define individual operations.</text></svg>