<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1225" viewBox="0 0 1200 1225" role="img" aria-label="12  Plan, daily usage and billing boundaries"><title>12  Plan, daily usage and billing boundaries</title><desc>The plan dialog combines three reads; generation checks and recording happen at different times. Paid upgrade UI is disabled. Stripe backend code remains optional. Usage estimates and application limits are not provider invoices or a strict spend cap.</desc><rect width="100%" height="100%" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60778c" /></marker><marker id="async-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b78222" /></marker></defs><text x="60" y="61" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#23364b" text-anchor="start">12  Plan, daily usage and billing boundaries</text><text x="60" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526278" text-anchor="start">The plan dialog combines three reads; generation checks and recording happen at different times.</text><polyline points="600.0,310 600,360 220,360 220.0,425" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="600.0,310 600.0,425" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="600.0,310 600,340 980,340 980.0,425" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="220.0,595 220,660 600,660 600.0,715" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="600.0,595 600.0,715" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="980.0,595 980,680 600,680 600.0,715" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="380,1042.5 440,1042.5" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="760,1042.5 820,1042.5" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="440" y="140" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="458" y="181" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Open Plan &amp; usage</text><text x="458" y="217" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">The frontend starts these</text><text x="458" y="243" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">three requests in parallel.</text><rect x="60" y="425" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="78" y="466" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Account: subscribed plan</text><text x="78" y="502" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Plan name, project limit, daily</text><text x="78" y="528" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">token allowance and status.</text><rect x="440" y="425" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="458" y="466" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Workspace: project list</text><text x="458" y="502" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">The frontend counts</text><text x="458" y="528" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">accessible projects with</text><text x="458" y="554" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">OWNER role.</text><rect x="820" y="425" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="838" y="466" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Intelligence: today usage</text><text x="838" y="502" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Return recorded tokens,</text><text x="838" y="528" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">server date and server</text><text x="838" y="554" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">time-zone ID.</text><rect x="440" y="715" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="458" y="756" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Display the combined</text><text x="458" y="784" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">result</text><text x="458" y="817" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">Owned projects / limit</text><text x="458" y="840" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">Daily tokens / allowance</text><text x="458" y="863" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">Plan status + usage date</text><rect x="60" y="970" width="320" height="145" rx="14" fill="#fff0eb" stroke="#bd6142" stroke-width="1.8" /><text x="78" y="1011" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Before generation</text><text x="78" y="1046" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">Reject if current daily usage</text><text x="78" y="1071" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">already meets the plan limit.</text><rect x="440" y="970" width="320" height="145" rx="14" fill="#fff5dd" stroke="#b78222" stroke-width="1.8" /><text x="458" y="1011" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">After stream completion</text><text x="458" y="1045" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">Record reported tokens, or</text><text x="458" y="1069" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">estimate from prompt/output text.</text><rect x="820" y="970" width="320" height="145" rx="14" fill="#fff0eb" stroke="#bd6142" stroke-width="1.8" /><text x="838" y="1011" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Accounting limitations</text><text x="838" y="1045" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">In-flight usage is not reserved.</text><text x="838" y="1069" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">Actual model/provider charges</text><text x="838" y="1093" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">are separate.</text><text x="60" y="940" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">Separate generation accounting path</text><line x1="60" y1="1140" x2="1140" y2="1140" stroke="#dde4ec" /><text x="60" y="1174" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">Paid upgrade UI is disabled. Stripe backend code remains optional. Usage estimates and application limits are not provider invoices or</text><text x="60" y="1197" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">a strict spend cap.</text></svg>