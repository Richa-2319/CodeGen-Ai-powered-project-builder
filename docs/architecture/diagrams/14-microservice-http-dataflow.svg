<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="1420" viewBox="0 0 2220 1420" role="img" aria-label="14  Microservice dataflow: direct HTTP requests and responses"><title>14  Microservice dataflow: direct HTTP requests and responses</title><desc>Component dataflow with labeled directional connectors. See the accompanying microservice dataflow guide for payload and source details.</desc><rect width="100%" height="100%" fill="#FFFFFF" /><defs><marker id="arrow3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3878C5" /></marker><marker id="open3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#3878C5" /></marker><marker id="arrow25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25866B" /></marker><marker id="open25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#25866B" /></marker><marker id="arrow8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8461B3" /></marker><marker id="open8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#8461B3" /></marker><marker id="arrowB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B78222" /></marker><marker id="openB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#B78222" /></marker></defs><polyline points="304.5,785 304.5,255 850,255.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="942.0,330 942,430 516,430 516.0,785" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" /><polyline points="1681.6,785 1681.6,255 1310,255.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="1218.0,330 1218,430 1897.8,430 1897.8,785" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" /><polyline points="1550,844.2 610,844.2" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="610,927.45 1550,927.45" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" /><rect x="850" y="180" width="460" height="150" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="870" y="227" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Account service :9050</text><text x="870" y="266" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Owns user identity and plan limits</text><rect x="140" y="785" width="470" height="185" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="160" y="832" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Workspace service :9020</text><text x="160" y="871" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Creates projects, manages members and</text><text x="160" y="898" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">reads saved project files</text><rect x="1550" y="785" width="470" height="185" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="1570" y="832" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Intelligence service :9030</text><text x="1570" y="871" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Checks access and allowance; builds project</text><text x="1570" y="898" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">context for the model</text><rect x="820" y="520" width="620" height="185" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="840" y="567" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Every internal request carries identity</text><text x="840" y="606" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Feign forwards the caller JWT and an internal service</text><text x="840" y="633" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">header. Async file reads retain the caller JWT explicitly.</text><text x="840" y="660" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Workspace still checks project permissions.</text><rect x="80" y="1090" width="650" height="210" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="100" y="1137" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">A · Workspace → Account</text><text x="100" y="1176" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Create project: read maxProjects.</text><text x="100" y="1203" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Share: resolve an existing email.</text><text x="100" y="1230" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">List members: resolve user details.</text><rect x="785" y="1090" width="650" height="210" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="805" y="1137" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">B · Intelligence → Account</text><text x="805" y="1176" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Read the caller’s daily token limit before generation.</text><text x="805" y="1203" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Intelligence compares it with its own usage records.</text><rect x="1490" y="1090" width="650" height="210" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="1510" y="1137" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">C · Intelligence → Workspace</text><text x="1510" y="1176" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Check EDIT permission.</text><text x="1510" y="1203" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Fetch the saved file tree.</text><text x="1510" y="1230" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">read_files tool fetches source content.</text><text x="66" y="74" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#203247">14 Microservice dataflow: direct HTTP requests and responses</text><text x="66" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Blue arrows carry requests. Green arrows carry returned data. These service calls use configured internal URLs, not the public gateway.</text><text x="356" y="222" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#3878C5">A · GET current plan, user by email / ID</text><text x="536" y="469" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#25866B">A · PlanDto / UserDto</text><text x="1346" y="222" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#3878C5">B · GET current plan</text><text x="1266" y="469" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#25866B">B · PlanDto with daily token allowance</text><rect x="685" y="744" width="820" height="86" rx="5" fill="#FFFFFF" /><text x="691" y="771" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#3878C5">C · GET permission, file tree or file content</text><text x="691" y="800" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#3878C5">Inputs: projectId, EDIT permission or file path</text><text x="686" y="972" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#25866B">C · Returns allowed/denied, FileTreeDto or saved source text</text><text x="86" y="1366" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Account does not call the other two services in these flows. There are no cross-service SQL reads. Exact endpoint paths and payloads are listed in the guide.</text></svg>