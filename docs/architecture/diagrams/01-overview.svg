<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1230" viewBox="0 0 1200 1230" role="img" aria-label="01  CodeGen at a glance"><title>01  CodeGen at a glance</title><desc>The browser calls one gateway; each service owns a clear responsibility. Blue: browser/UI  |  Green: application  |  Purple: durable data  |  Gold dashed arrows: asynchronous messages</desc><rect width="100%" height="100%" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60778c" /></marker><marker id="async-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b78222" /></marker></defs><text x="60" y="61" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#23364b" text-anchor="start">01  CodeGen at a glance</text><text x="60" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526278" text-anchor="start">The browser calls one gateway; each service owns a clear responsibility.</text><polyline points="380,235.0 440,235.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="760,235.0 820,235.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="980.0,320 980,365 220,365 220.0,425" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="980.0,320 980,385 600,385 600.0,425" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="980.0,320 980.0,425" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="220.0,595 220.0,720" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="600.0,595 600,660 220,660 220.0,720" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="980.0,595 980,640 220,640 220.0,720" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="600.0,595 600.0,720" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="1140,510.0 1165,510 1165,805 1140,805.0" fill="none" stroke="#b78222" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#async-arrow)" stroke-dasharray="9 6" /><polyline points="820,805.0 790,805 790,510 760,510.0" fill="none" stroke="#b78222" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#async-arrow)" stroke-dasharray="9 6" /><polyline points="1140,510.0 1185,510 1185,1043 1140,1050.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="60" y="150" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="78" y="191" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">User in a browser</text><text x="78" y="227" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Sign in, build, edit, preview,</text><text x="78" y="253" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">share and publish.</text><rect x="440" y="150" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="458" y="191" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">React + nginx</text><text x="458" y="227" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">UI assets and a same-origin</text><text x="458" y="253" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">proxy for all application API</text><text x="458" y="279" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">paths.</text><rect x="820" y="150" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="838" y="191" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">API gateway</text><text x="838" y="227" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Routes /account, /workspace</text><text x="838" y="253" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">and /intelligence; validates</text><text x="838" y="279" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">JWTs.</text><rect x="60" y="425" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="78" y="466" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Account service</text><text x="78" y="502" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Users, password verification</text><text x="78" y="528" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">and subscription/plan</text><text x="78" y="554" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">information.</text><rect x="440" y="425" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="458" y="466" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Workspace service</text><text x="458" y="502" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Projects, roles, file access,</text><text x="458" y="528" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">preview bundles and public</text><text x="458" y="554" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">snapshots.</text><rect x="820" y="425" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="838" y="466" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Intelligence service</text><text x="838" y="502" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Permission/quota checks,</text><text x="838" y="528" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">model streaming, chat events</text><text x="838" y="554" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">and usage.</text><rect x="60" y="720" width="320" height="170" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="78" y="761" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">PostgreSQL</text><text x="78" y="797" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Three service databases:</text><text x="78" y="823" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">account, workspace and</text><text x="78" y="849" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">intelligence.</text><rect x="440" y="720" width="320" height="170" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="458" y="761" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">MinIO object storage</text><text x="458" y="797" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Saved project source files.</text><text x="458" y="823" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Database rows contain object</text><text x="458" y="849" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">keys.</text><rect x="820" y="720" width="320" height="170" rx="14" fill="#fff5dd" stroke="#b78222" stroke-width="1.8" /><text x="838" y="761" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Kafka message broker</text><text x="838" y="797" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">File storage request and</text><text x="838" y="823" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">response topics join</text><text x="838" y="849" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Intelligence to Workspace.</text><rect x="60" y="980" width="320" height="140" rx="14" fill="#f1f3f6" stroke="#7a8796" stroke-width="1.8" /><text x="78" y="1021" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Optional or disabled</text><text x="78" y="1054" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">Redis + runner proxy: server</text><text x="78" y="1077" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">previews disabled. Config/Eureka</text><text x="78" y="1100" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">optional.</text><rect x="440" y="980" width="320" height="125" rx="14" fill="#f1f3f6" stroke="#7a8796" stroke-width="1.8" /><text x="458" y="1021" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">common-lib</text><text x="458" y="1054" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">Shared Java types, security, errors</text><text x="458" y="1077" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">and Kafka event contracts.</text><rect x="820" y="980" width="320" height="140" rx="14" fill="#fff5dd" stroke="#b78222" stroke-width="1.8" /><text x="838" y="1021" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">External AI provider</text><text x="838" y="1054" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">Configured endpoint + model.</text><text x="838" y="1077" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">Model inference is separately</text><text x="838" y="1100" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">metered.</text><line x1="60" y1="1168" x2="1140" y2="1168" stroke="#dde4ec" /><text x="60" y="1202" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">Blue: browser/UI | Green: application | Purple: durable data | Gold dashed arrows: asynchronous messages</text></svg>