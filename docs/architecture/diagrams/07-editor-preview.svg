<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-label="07  Edit, save and run a browser preview"><title>07  Edit, save and run a browser preview</title><desc>Generated frontend code runs in an isolated browser frame. Production CSP blocks preview network calls and parent-origin access. Unsupported packages fail clearly; no arbitrary npm install or server process runs.</desc><rect width="100%" height="100%" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60778c" /></marker><marker id="async-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b78222" /></marker></defs><text x="60" y="61" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#23364b" text-anchor="start">07  Edit, save and run a browser preview</text><text x="60" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526278" text-anchor="start">Generated frontend code runs in an isolated browser frame.</text><polyline points="380,245.0 440,245.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="760,245.0 820,245.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="980.0,330 980.0,415" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="820,500.0 760,500.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="440,500.0 380,500.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="220.0,585 220.0,670" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="380,755.0 440,755.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="760,755.0 820,755.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="60" y="160" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="78" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">01 Edit or generate</text><text x="78" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">The editor holds drafts and</text><text x="78" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">recent streamed file updates</text><text x="78" y="289" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">locally.</text><rect x="440" y="160" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="458" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">02 Save a file</text><text x="458" y="235" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">PUT</text><text x="458" y="259" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">/workspace/projects/{id}/files/con</text><text x="458" y="283" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">tent; requires EDIT permission.</text><rect x="820" y="160" width="320" height="170" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="838" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">03 Persist synchronously</text><text x="838" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Workspace normalizes the</text><text x="838" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">path, writes MinIO and saves</text><text x="838" y="289" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">file metadata.</text><rect x="820" y="415" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="838" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">04 Fetch a preview</text><text x="838" y="484" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">bundle</text><text x="838" y="517" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">GET</text><text x="838" y="540" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">/workspace/projects/{id}/preview</text><text x="838" y="563" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">reads allowed saved frontend files.</text><rect x="440" y="415" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="458" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">05 Prepare current files</text><text x="458" y="492" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">PreviewPanel merges the</text><text x="458" y="518" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">saved bundle with recent</text><text x="458" y="544" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">local file updates.</text><rect x="60" y="415" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="78" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">06 Cross the frame</text><text x="78" y="484" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">boundary</text><text x="78" y="517" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">Send source files + runId by</text><text x="78" y="540" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">postMessage to</text><text x="78" y="563" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">sandbox=allow-scripts.</text><rect x="60" y="670" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="78" y="711" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">07 Compile and resolve</text><text x="78" y="747" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">The TypeScript compiler</text><text x="78" y="773" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">resolves relative imports, @/</text><text x="78" y="799" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">and bundled packages.</text><rect x="440" y="670" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="458" y="711" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">08 Render the React app</text><text x="458" y="745" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">The frame loads</text><text x="458" y="769" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">HTML/CSS/modules. Its</text><text x="458" y="793" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">temporary storage resets on</text><text x="458" y="817" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">restart.</text><rect x="820" y="670" width="320" height="170" rx="14" fill="#fff0eb" stroke="#bd6142" stroke-width="1.8" /><text x="838" y="711" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">09 Report success or</text><text x="838" y="739" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">error</text><text x="838" y="772" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">The parent checks frame identity</text><text x="838" y="795" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">and runId; errors appear in the UI.</text><line x1="60" y1="945" x2="1140" y2="945" stroke="#dde4ec" /><text x="60" y="979" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">Production CSP blocks preview network calls and parent-origin access. Unsupported packages fail clearly; no arbitrary npm install or</text><text x="60" y="1002" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">server process runs.</text></svg>