<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="1590" viewBox="0 0 2220 1590" role="img" aria-label="25  UML component and package dependencies"><title>25  UML component and package dependencies</title><desc>Component dataflow with labeled directional connectors. See the accompanying microservice dataflow guide for payload and source details.</desc><rect width="100%" height="100%" fill="#FFFFFF" /><defs><marker id="arrow3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3878C5" /></marker><marker id="open3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#3878C5" /></marker><marker id="arrow25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25866B" /></marker><marker id="open25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#25866B" /></marker><marker id="arrow8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8461B3" /></marker><marker id="open8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#8461B3" /></marker><marker id="arrowB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B78222" /></marker><marker id="openB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#B78222" /></marker></defs><rect x="60" y="190" width="530" height="1220" fill="#FBFCFE" stroke="#B7C3D1" stroke-width="2" stroke-dasharray="8 5" /><text x="76" y="223" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#536479">Frontend source and image</text><rect x="640" y="190" width="990" height="1220" fill="#FBFCFE" stroke="#B7C3D1" stroke-width="2" stroke-dasharray="8 5" /><text x="656" y="223" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#536479">Spring application components</text><rect x="1680" y="190" width="480" height="1220" fill="#FBFCFE" stroke="#B7C3D1" stroke-width="2" stroke-dasharray="8 5" /><text x="1696" y="223" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#536479">External / optional components</text><polyline points="320.0,450 320.0,650" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" stroke-dasharray="10 7" /><polyline points="110,362.5 85,362.5 85,1210 110,1210.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" stroke-dasharray="10 7" /><polyline points="530,1210.0 610,1210 610,362.5 740,362.5" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" stroke-dasharray="10 7" /><polyline points="898.0,450 898,560 902.5,560 902.5,650" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" stroke-dasharray="10 7" /><polyline points="1372.0,450 1372,560 1372.5,560 1372.5,650" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" stroke-dasharray="10 7" /><polyline points="1530,362.5 1605,362.5 1605,1190 1565,1190.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" stroke-dasharray="10 7" /><polyline points="902.5,825 902.5,1100" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" stroke-dasharray="10 7" /><polyline points="1372.5,825 1372.5,995 1135,995 1135,1200 1095,1200.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" stroke-dasharray="10 7" /><polyline points="1180,1190.0 1140,1190 1140,1200 1095,1200.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" stroke-dasharray="10 7" /><polyline points="1565,1190.0 1645,1190 1645,1210 1715,1210.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" stroke-dasharray="10 7" /><rect x="110" y="275" width="420" height="175" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="130" y="322" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">«component» React frontend</text><text x="130" y="361" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Routes, editor, dialogs and stream</text><text x="130" y="388" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">parser</text><rect x="110" y="650" width="420" height="200" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="130" y="697" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">«component» Browser preview</text><text x="130" y="736" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Compiler and bundled UI packages in</text><text x="130" y="763" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">isolated iframe</text><rect x="110" y="1110" width="420" height="200" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="130" y="1157" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">«component» nginx</text><text x="130" y="1196" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Frontend image; same-origin API proxy</text><text x="130" y="1223" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">and static assets</text><rect x="740" y="275" width="790" height="175" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="760" y="322" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">«component» API gateway</text><text x="760" y="361" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Reactive routing + JWT filter</text><rect x="710" y="650" width="385" height="175" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="730" y="697" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">«component» Account</text><text x="730" y="736" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Auth, users and plans</text><rect x="1180" y="650" width="385" height="175" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="1200" y="697" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">«component» Workspace</text><text x="1200" y="736" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Projects, files, roles and snapshots</text><rect x="1180" y="1090" width="385" height="200" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="1200" y="1137" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">«component» Intelligence</text><text x="1200" y="1176" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Spring AI, chats, usage and file</text><text x="1200" y="1203" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">events</text><rect x="710" y="1100" width="385" height="200" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="730" y="1147" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">«package» common-lib</text><text x="730" y="1186" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">DTOs, events, roles, servlet</text><text x="730" y="1213" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">security and errors</text><rect x="1715" y="1110" width="410" height="200" rx="16" fill="#FFF5DD" stroke="#B78222" stroke-width="2" /><text x="1735" y="1157" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">«component» AI provider</text><text x="1735" y="1196" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Configured compatible endpoint and</text><text x="1735" y="1223" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">model</text><rect x="1715" y="265" width="410" height="290" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="1735" y="312" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Optional modules</text><text x="1735" y="351" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">config-service: Config Server</text><text x="1735" y="378" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">discovery-service: Eureka</text><text x="1735" y="405" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Retained source; omitted from normal</text><text x="1735" y="432" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Compose/demo runtime</text><rect x="1715" y="680" width="410" height="235" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="1735" y="727" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Storage components</text><text x="1735" y="766" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">PostgreSQL, Kafka, MinIO</text><text x="1735" y="793" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Redis for optional runner routes</text><text x="1735" y="820" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Runtime data edges: pages 13–15</text><text x="66" y="74" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#203247">25 UML component and package dependencies</text><text x="66" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">«component» marks a deployable runtime. Dashed dependency arrows point to a used component or shared package.</text><text x="81" y="1477" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#536479">Gateway uses its own reactive authentication filter; shared servlet security belongs to Account, Workspace and Intelligence. Internal service-to-service HTTP dependencies are expanded on page 14.</text></svg>