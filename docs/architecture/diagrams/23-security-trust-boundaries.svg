<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="1740" viewBox="0 0 2220 1740" role="img" aria-label="23  Security architecture: trust boundaries and data crossing them"><title>23  Security architecture: trust boundaries and data crossing them</title><desc>Component dataflow with labeled directional connectors. See the accompanying microservice dataflow guide for payload and source details.</desc><rect width="100%" height="100%" fill="#FFFFFF" /><defs><marker id="arrow3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3878C5" /></marker><marker id="open3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#3878C5" /></marker><marker id="arrow25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25866B" /></marker><marker id="open25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#25866B" /></marker><marker id="arrow8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8461B3" /></marker><marker id="open8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#8461B3" /></marker><marker id="arrowB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B78222" /></marker><marker id="openB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#B78222" /></marker></defs><rect x="60" y="190" width="2100" height="345" fill="#FBFCFE" stroke="#B7C3D1" stroke-width="2" stroke-dasharray="8 5" /><text x="76" y="223" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#536479">Untrusted browser environment</text><rect x="60" y="610" width="2100" height="495" fill="#FBFCFE" stroke="#B7C3D1" stroke-width="2" stroke-dasharray="8 5" /><text x="76" y="643" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#536479">HTTPS edge and application services</text><rect x="60" y="1180" width="2100" height="370" fill="#FBFCFE" stroke="#B7C3D1" stroke-width="2" stroke-dasharray="8 5" /><text x="76" y="1213" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#536479">Service-owned persistence and external inference</text><polyline points="790,370.0 1100,370 1370,370.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" marker-start="url(#arrow3878C5)" /><polyline points="465.0,465 465.0,745" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="790,855.0 1100,855 1100,852.5 1370,852.5" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" marker-start="url(#arrow3878C5)" /><polyline points="1545.0,970 1545,1150 575,1150 575.0,1295" fill="none" stroke="#8461B3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow8461B3)" /><polyline points="1895.0,970 1895,1140 1720,1140 1720.0,1295" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><rect x="140" y="275" width="650" height="190" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="160" y="322" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Main React application</text><text x="160" y="361" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Stores login state; sends protected API requests with caller</text><text x="160" y="388" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">identity</text><rect x="1370" y="260" width="700" height="220" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="1390" y="307" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Generated-code sandbox</text><text x="1390" y="346" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">allow-scripts only; opaque origin</text><text x="1390" y="373" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Production CSP connect-src none</text><text x="1390" y="400" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Receives files + runId, no auth token</text><rect x="140" y="745" width="650" height="220" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="160" y="792" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">nginx → API gateway</text><text x="160" y="831" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">JWT validation on protected routes</text><text x="160" y="858" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">External /internal paths blocked</text><text x="160" y="885" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Public auth / snapshot exceptions</text><rect x="1370" y="735" width="700" height="235" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="1390" y="782" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Domain services</text><text x="1390" y="821" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Caller identity + internal service header</text><text x="1390" y="848" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Workspace role checks on operations</text><text x="1390" y="875" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Public snapshot requires active + nondeleted</text><rect x="150" y="1295" width="850" height="180" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="170" y="1342" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">PostgreSQL / MinIO / Kafka</text><text x="170" y="1381" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Private dependency endpoints and credentials</text><text x="170" y="1408" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Roles protect application APIs; storage remains service-owned</text><rect x="1370" y="1295" width="700" height="180" rx="16" fill="#FFF5DD" stroke="#B78222" stroke-width="2" /><text x="1390" y="1342" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Configured model provider</text><text x="1390" y="1381" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Receives prompt, project tree and selected file content; returns</text><text x="1390" y="1408" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">generated text</text><text x="66" y="74" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#203247">23 Security architecture: trust boundaries and data crossing them</text><text x="66" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">This shows implemented controls and deployment requirements. A boundary rectangle is not a claim that network isolation is enforced.</text><text x="836" y="325" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">postMessage: source / status</text><text x="191" y="582" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">HTTPS at configured edge</text><text x="191" y="609" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">JWT on protected requests</text><text x="836" y="808" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">Routed requests / responses</text><text x="156" y="1220" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#8461B3">Private persistence APIs</text><text x="1496" y="1240" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">HTTPS inference data</text><text x="76" y="1606" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Publication boundary: a published frontend snapshot is readable without login. Review source contents before publishing; path filtering is not a general secret-content scanner.</text><text x="76" y="1686" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Deployment gaps: demo Flannel does not enforce NetworkPolicies; runner-management RBAC remains despite disabled execution. Production hardening is listed in the HLD.</text></svg>