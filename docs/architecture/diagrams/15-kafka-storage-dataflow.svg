<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="1420" viewBox="0 0 2220 1420" role="img" aria-label="15  File dataflow: Intelligence → Kafka → Workspace → storage"><title>15  File dataflow: Intelligence → Kafka → Workspace → storage</title><desc>Component dataflow with labeled directional connectors. See the accompanying microservice dataflow guide for payload and source details.</desc><rect width="100%" height="100%" fill="#FFFFFF" /><defs><marker id="arrow3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3878C5" /></marker><marker id="open3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#3878C5" /></marker><marker id="arrow25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25866B" /></marker><marker id="open25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#25866B" /></marker><marker id="arrow8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8461B3" /></marker><marker id="open8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#8461B3" /></marker><marker id="arrowB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B78222" /></marker><marker id="openB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#B78222" /></marker></defs><polyline points="315.0,465 315,285 700,285.0" fill="none" stroke="#B78222" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowB78222)" stroke-dasharray="10 7" /><polyline points="1250,285.0 1565,285 1565.0,465" fill="none" stroke="#B78222" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowB78222)" stroke-dasharray="10 7" /><polyline points="1565.0,680 1565,920 1250,920.0" fill="none" stroke="#B78222" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowB78222)" stroke-dasharray="10 7" /><polyline points="700,920.0 401,920 401.0,680" fill="none" stroke="#B78222" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowB78222)" stroke-dasharray="10 7" /><polyline points="186.0,680 186,1070 210,1070 210.0,1125" fill="none" stroke="#8461B3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow8461B3)" /><polyline points="1780,529.5 2005,529.5 2005.0,385" fill="none" stroke="#8461B3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow8461B3)" /><polyline points="1780,626.25 1840,626.25 1840,1235 1800,1235.0" fill="none" stroke="#8461B3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow8461B3)" marker-start="url(#arrow8461B3)" /><rect x="100" y="465" width="430" height="215" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="120" y="512" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Intelligence service</text><text x="120" y="551" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Parses completed FILE_EDIT events.</text><text x="120" y="578" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Assigns sagaId and tracks PENDING.</text><text x="120" y="605" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Resolves the result by sagaId.</text><rect x="1350" y="465" width="430" height="215" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="1370" y="512" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Workspace service</text><text x="1370" y="551" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Checks processed sagaId.</text><text x="1370" y="578" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Stores file bytes and metadata.</text><text x="1370" y="605" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Publishes success or failure.</text><rect x="700" y="190" width="550" height="190" rx="16" fill="#FFF5DD" stroke="#B78222" stroke-width="2" /><text x="720" y="237" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Kafka · file-storage-request-event</text><text x="720" y="276" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">projectId, sagaId, filePath, content, userId</text><text x="720" y="303" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Key: project-{projectId}</text><rect x="700" y="825" width="550" height="190" rx="16" fill="#FFF5DD" stroke="#B78222" stroke-width="2" /><text x="720" y="872" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Kafka · file-store-responses</text><text x="720" y="911" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">sagaId, projectId, success, errorMessage</text><text x="720" y="938" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Key: project-{projectId}</text><rect x="100" y="1125" width="550" height="220" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="120" y="1172" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">intelligence_db</text><text x="120" y="1211" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">chat_events: PENDING → CONFIRMED / FAILED</text><text x="120" y="1238" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Chat messages and usage are also recorded during</text><text x="120" y="1265" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">finalization.</text><rect x="1250" y="1125" width="550" height="220" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="1270" y="1172" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">workspace_db</text><text x="1270" y="1211" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">project_files: path → object key</text><text x="1270" y="1238" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">processed_events: sagaId marker</text><text x="1270" y="1265" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Duplicates skip the write and resend ACK.</text><rect x="1850" y="170" width="310" height="215" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="1870" y="217" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">MinIO · projects</text><text x="1870" y="248" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">bucket</text><text x="1870" y="287" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Object key: projectId/path</text><text x="1870" y="314" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Object value: source bytes</text><text x="66" y="74" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#203247">15 File dataflow: Intelligence → Kafka → Workspace → storage</text><text x="66" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Follow the numbered arrows around the loop. Gold dashed arrows are Kafka events; purple arrows are storage reads or writes.</text><text x="346" y="251" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#B78222">2 · Publish file content</text><text x="1276" y="251" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#B78222">3 · Consume request</text><rect x="1280" y="855" width="430" height="50" rx="5" fill="#FFFFFF" /><text x="1286" y="881" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#B78222">6 · Publish save result</text><text x="431" y="881" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#B78222">7 · Consume result</text><rect x="210" y="1024" width="900" height="90" rx="5" fill="#FFFFFF" /><text x="216" y="1050" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#8461B3">1 · Commit PENDING before publish</text><text x="216" y="1078" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#8461B3">8 · Update final status after result</text><text x="1811" y="581" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#8461B3">4 · PUT source bytes</text><text x="1854" y="995" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#8461B3">5 · Read duplicate marker;</text><text x="1854" y="1022" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#8461B3">commit metadata and marker</text><text x="746" y="481" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Success follows the metadata and marker commits. A</text><text x="746" y="509" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">storage error produces success=false. A failed ACK</text><text x="746" y="537" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">send surfaces for retry.</text><text x="746" y="668" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">The browser’s SSE stream can finish before this loop.</text><text x="746" y="696" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Storage ACKs do not return on that stream. A later</text><text x="746" y="724" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Workspace read fetches saved files.</text><text x="86" y="1395" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#536479">Failure boundary: there is no transactional outbox or atomic transaction across PostgreSQL, Kafka and MinIO. A crash can leave partial progress.</text></svg>