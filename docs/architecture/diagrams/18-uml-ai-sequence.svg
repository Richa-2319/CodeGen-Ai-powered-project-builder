<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1900" viewBox="0 0 2300 1900" role="img" aria-label="18  UML sequence: prompt checks, model stream and finalization"><title>18  UML sequence: prompt checks, model stream and finalization</title><desc>Component dataflow with labeled directional connectors. See the accompanying microservice dataflow guide for payload and source details.</desc><rect width="100%" height="100%" fill="#FFFFFF" /><defs><marker id="arrow3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3878C5" /></marker><marker id="open3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#3878C5" /></marker><marker id="arrow25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25866B" /></marker><marker id="open25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#25866B" /></marker><marker id="arrow8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8461B3" /></marker><marker id="open8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#8461B3" /></marker><marker id="arrowB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B78222" /></marker><marker id="openB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#B78222" /></marker></defs><polyline points="160.0,290.0 160.0,1750.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" /><polyline points="556.0,290.0 556.0,1750.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" /><polyline points="952.0,290.0 952.0,1750.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" /><polyline points="1348.0,290.0 1348.0,1750.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" /><polyline points="1744.0,290.0 1744.0,1750.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" /><polyline points="2140.0,290.0 2140.0,1750.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" /><polyline points="160.0,355.0 556.0,355.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="556.0,457.0 952.0,457.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="952.0,559.0 1348.0,559.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="1348.0,661.0 952.0,661.0" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" stroke-dasharray="10 7" /><polyline points="952.0,763.0 1744.0,763.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="1744.0,865.0 952.0,865.0" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" stroke-dasharray="10 7" /><polyline points="952.0,1069.0 1348.0,1069.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="1348.0,1171.0 952.0,1171.0" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" stroke-dasharray="10 7" /><polyline points="952.0,1273.0 2140.0,1273.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="2140.0,1375.0 952.0,1375.0" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" stroke-dasharray="10 7" /><polyline points="952.0,1477.0 160.0,1477.0" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" stroke-dasharray="10 7" /><rect x="35.0" y="180" width="250" height="110" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="55.0" y="227" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Browser</text><rect x="431.0" y="180" width="250" height="110" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="451.0" y="227" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Gateway</text><rect x="827.0" y="180" width="250" height="110" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="847.0" y="227" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Intelligence</text><rect x="1223.0" y="180" width="250" height="110" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="1243.0" y="227" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Workspace</text><rect x="1619.0" y="180" width="250" height="110" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="1639.0" y="227" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Account</text><rect x="2015.0" y="180" width="250" height="110" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="2035.0" y="227" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Model provider</text><text x="66" y="74" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#203247">18 UML sequence: prompt checks, model stream and finalization</text><text x="66" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Time runs downward. Solid arrows are calls; dashed green arrows return data. The file-storage loop is expanded on page 15.</text><text x="180.0" y="317" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#3878C5">1 · POST stream (projectId, prompt)</text><text x="576.0" y="419" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#3878C5">2 · Authenticated route</text><text x="972.0" y="521" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#3878C5">3 · Check EDIT permission</text><text x="972.0" y="623" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25866B">4 · Allowed / denied</text><text x="972.0" y="725" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#3878C5">5 · Read current plan</text><text x="972.0" y="827" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25866B">6 · Plan and daily allowance</text><rect x="450" y="945" width="1760" height="65" rx="5" fill="#FFFFFF" /><text x="456" y="971" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Intelligence checks today’s usage, then gets or creates the user/project chat session. Denied access or exhausted allowance ends the request.</text><text x="972.0" y="1031" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#3878C5">7 · Fetch saved file tree</text><text x="972.0" y="1133" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25866B">8 · FileTreeDto</text><text x="972.0" y="1235" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#3878C5">9 · System + prompt + project context</text><text x="972.0" y="1337" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25866B">10 · Stream model output</text><text x="180.0" y="1439" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25866B">11 · SSE chunks return through gateway and nginx</text><rect x="450" y="1557" width="1760" height="65" rx="5" fill="#FFFFFF" /><text x="456" y="1583" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Optional tool loop: model read_files → Intelligence → Workspace → saved text. Repeat while the model is generating.</text><rect x="450" y="1659" width="1760" height="65" rx="5" fill="#FFFFFF" /><text x="456" y="1685" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Provider completion schedules background work: usage + messages + parsed events → committed PENDING events → Kafka publication (page 15).</text><text x="66" y="1839" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">SSE completion is separate from durable file completion. Stored chat history is a separate read API; the traced prompt path does not load it as conversation memory.</text></svg>