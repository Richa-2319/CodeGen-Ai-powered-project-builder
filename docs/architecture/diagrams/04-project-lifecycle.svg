<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-label="04  Create a project and manage its lifecycle"><title>04  Create a project and manage its lifecycle</title><desc>Workspace owns project records; Account owns plan limits. Creating a project creates metadata. The source files arrive through generation or an authorized file save.</desc><rect width="100%" height="100%" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60778c" /></marker><marker id="async-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b78222" /></marker></defs><text x="60" y="61" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#23364b" text-anchor="start">04  Create a project and manage its lifecycle</text><text x="60" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526278" text-anchor="start">Workspace owns project records; Account owns plan limits.</text><polyline points="380,245.0 440,245.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="760,245.0 820,245.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="980.0,330 980.0,415" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="820,500.0 760,500.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="440,500.0 380,500.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="60" y="160" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="78" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">01 Create from</text><text x="78" y="229" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">dashboard</text><text x="78" y="263" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">POST /workspace/projects with</text><text x="78" y="287" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">the project name and user JWT.</text><rect x="440" y="160" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="458" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">02 Enter Workspace</text><text x="458" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">The authenticated service</text><text x="458" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">resolves the current user.</text><rect x="820" y="160" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="838" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">03 Ask Account for limits</text><text x="838" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">An internal Feign request</text><text x="838" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">retrieves the current</text><text x="838" y="289" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">subscribed plan.</text><rect x="820" y="415" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="838" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">04 Check owned projects</text><text x="838" y="492" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Compare the owner count</text><text x="838" y="518" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">with maxProjects; reject</text><text x="838" y="544" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">when full.</text><rect x="440" y="415" width="320" height="170" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="458" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">05 Save project + owner</text><text x="458" y="492" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">One workspace transaction</text><text x="458" y="518" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">stores the project and</text><text x="458" y="544" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">OWNER membership.</text><rect x="60" y="415" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="78" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">06 Open the editor</text><text x="78" y="492" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Return the project ID and</text><text x="78" y="518" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">role; the dashboard lists</text><text x="78" y="544" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">accessible projects.</text><rect x="60" y="700" width="320" height="165" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="78" y="741" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Read and rename</text><text x="78" y="776" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">Members can read; Owner and</text><text x="78" y="801" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">Editor can rename and edit.</text><rect x="440" y="700" width="320" height="165" rx="14" fill="#fff0eb" stroke="#bd6142" stroke-width="1.8" /><text x="458" y="741" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Delete = soft delete</text><text x="458" y="776" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">deletedAt hides the project; it</text><text x="458" y="801" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">also disables future public app</text><text x="458" y="826" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">reads.</text><rect x="820" y="700" width="320" height="165" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="838" y="741" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Download ZIP</text><text x="838" y="776" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">Workspace streams file</text><text x="838" y="801" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">contents from MinIO with path</text><text x="838" y="826" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">and size checks.</text><line x1="60" y1="968" x2="1140" y2="968" stroke="#dde4ec" /><text x="60" y="1002" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">Creating a project creates metadata. The source files arrive through generation or an authorized file save.</text></svg>