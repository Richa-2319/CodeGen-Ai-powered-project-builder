<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-label="09  Publish a saved app as a public snapshot"><title>09  Publish a saved app as a public snapshot</title><desc>A publication is a stored frontend snapshot, not a new cloud deployment. Private edits do not alter the published snapshot until republish. Public readers can obtain its frontend source; downloaded copies cannot be recalled.</desc><rect width="100%" height="100%" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60778c" /></marker><marker id="async-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b78222" /></marker></defs><text x="60" y="61" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#23364b" text-anchor="start">09  Publish a saved app as a public snapshot</text><text x="60" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526278" text-anchor="start">A publication is a stored frontend snapshot, not a new cloud deployment.</text><polyline points="380,245.0 440,245.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="760,245.0 820,245.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="980.0,330 980.0,415" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="820,500.0 760,500.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="440,500.0 380,500.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="220.0,585 220.0,670" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="380,755.0 440,755.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="760,755.0 820,755.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="60" y="160" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="78" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">01 Owner selects Publish</text><text x="78" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">POST</text><text x="78" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">/workspace/projects/{id}/publi</text><text x="78" y="289" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">cation after checking the app.</text><rect x="440" y="160" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="458" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">02 Lock the active project</text><text x="458" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Workspace rejects deleted</text><text x="458" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">projects and captures</text><text x="458" y="289" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">allowed frontend files.</text><rect x="820" y="160" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="838" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">03 Validate the app entry</text><text x="838" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Require index.html or a</text><text x="838" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">supported main/index/App</text><text x="838" y="289" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">source entry.</text><rect x="820" y="415" width="320" height="170" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="838" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">04 Save a snapshot +</text><text x="838" y="484" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">slug</text><text x="838" y="517" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">Store name/files as JSON text in</text><text x="838" y="540" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">project_publications; mark active.</text><rect x="440" y="415" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="458" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">05 Return a public link</text><text x="458" y="492" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">The stable link is /p/{slug}; no</text><text x="458" y="518" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">viewer login is required.</text><rect x="60" y="415" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="78" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">06 Load anonymously</text><text x="78" y="492" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">PublishedApp calls GET</text><text x="78" y="518" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">/workspace/public/apps/{slug</text><text x="78" y="544" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">} without credentials.</text><rect x="60" y="670" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="78" y="711" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">07 Check active + not</text><text x="78" y="739" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">deleted</text><text x="78" y="772" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">Workspace reads only an active</text><text x="78" y="795" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">snapshot whose project still exists.</text><rect x="440" y="670" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="458" y="711" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">08 Render in the sandbox</text><text x="458" y="747" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">The same isolated browser</text><text x="458" y="773" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">runtime displays the</text><text x="458" y="799" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">published frontend.</text><rect x="820" y="670" width="320" height="170" rx="14" fill="#fff0eb" stroke="#bd6142" stroke-width="1.8" /><text x="838" y="711" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">09 Manage later versions</text><text x="838" y="747" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Republish replaces the</text><text x="838" y="773" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">snapshot. Unpublish or</text><text x="838" y="799" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">delete blocks future reads.</text><line x1="60" y1="945" x2="1140" y2="945" stroke="#dde4ec" /><text x="60" y="979" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">Private edits do not alter the published snapshot until republish. Public readers can obtain its frontend source; downloaded copies</text><text x="60" y="1002" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">cannot be recalled.</text></svg>