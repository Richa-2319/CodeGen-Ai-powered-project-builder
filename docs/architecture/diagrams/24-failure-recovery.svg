<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="1660" viewBox="0 0 2220 1660" role="img" aria-label="24  Reliability view: locate a failure by the last completed boundary"><title>24  Reliability view: locate a failure by the last completed boundary</title><desc>Component dataflow with labeled directional connectors. See the accompanying microservice dataflow guide for payload and source details.</desc><rect width="100%" height="100%" fill="#FFFFFF" /><defs><marker id="arrow3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3878C5" /></marker><marker id="open3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#3878C5" /></marker><marker id="arrow25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25866B" /></marker><marker id="open25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#25866B" /></marker><marker id="arrow8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8461B3" /></marker><marker id="open8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#8461B3" /></marker><marker id="arrowB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B78222" /></marker><marker id="openB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#B78222" /></marker></defs><polyline points="660,322.5 820,322.5" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="1400,322.5 1560,322.5" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="1850.0,415 1850.0,630" fill="none" stroke="#B78222" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowB78222)" stroke-dasharray="10 7" /><polyline points="1560,730.0 1400,730.0" fill="none" stroke="#B78222" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowB78222)" stroke-dasharray="10 7" /><polyline points="820,730.0 660,730.0" fill="none" stroke="#B78222" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowB78222)" stroke-dasharray="10 7" /><polyline points="370.0,830 370.0,1070" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><rect x="80" y="230" width="580" height="185" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="100" y="277" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Request accepted</text><text x="100" y="316" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Gateway authentication; project permission; plan and</text><text x="100" y="343" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">recorded-usage checks</text><rect x="820" y="230" width="580" height="185" rx="16" fill="#FFF5DD" stroke="#B78222" stroke-width="2" /><text x="840" y="277" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Model stream</text><text x="840" y="316" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Provider availability; input/output stream; browser</text><text x="840" y="343" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">parsing</text><rect x="1560" y="230" width="580" height="185" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="1580" y="277" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Background finalization</text><text x="1580" y="316" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Persist usage, messages, parsed events and PENDING</text><text x="1580" y="343" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">tracking</text><rect x="1560" y="630" width="580" height="200" rx="16" fill="#FFF5DD" stroke="#B78222" stroke-width="2" /><text x="1580" y="677" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Kafka request publication</text><text x="1580" y="716" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Gap: database commit can precede a failed or missing</text><text x="1580" y="743" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">send; no outbox</text><rect x="820" y="630" width="580" height="200" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="840" y="677" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Workspace storage</text><text x="840" y="716" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Duplicate check → MinIO object → file metadata →</text><text x="840" y="743" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">processed marker</text><rect x="80" y="630" width="580" height="200" rx="16" fill="#FFF5DD" stroke="#B78222" stroke-width="2" /><text x="100" y="677" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Kafka response / tracking</text><text x="100" y="716" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Response send, response consumer, then CONFIRMED</text><text x="100" y="743" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">/ FAILED</text><rect x="80" y="1070" width="580" height="185" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="100" y="1117" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Later file / preview read</text><text x="100" y="1156" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Workspace resolves metadata and reads stored object</text><text x="100" y="1183" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">bytes</text><rect x="850" y="1060" width="1280" height="230" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="870" y="1107" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Read-only triage evidence</text><text x="870" y="1146" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">HTTP status and narrow service logs</text><text x="870" y="1173" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">projectId + sagaId + topic</text><text x="870" y="1200" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">PENDING status, processed marker, object key</text><text x="870" y="1227" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Kubernetes readiness / restarts</text><text x="66" y="74" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#203247">24 Reliability view: locate a failure by the last completed boundary</text><text x="66" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">A diagnostic dependency map, not an automatic recovery workflow. Retrying may be appropriate only after checking the stored saga and file state.</text><text x="791" y="480" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#B78222">Text visible ≠ finalization succeeded</text><text x="791" y="930" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#8461B3">Crash boundaries can leave partial data</text><text x="86" y="1397" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#536479">Implemented protections: duplicate-saga detection, explicit success/failure result, surfaced ACK-send failures, readiness/liveness probes and deployment validation scripts.</text><text x="86" y="1517" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#536479">Recommendations: transactional outbox, reconciliation of stuck events and partial file writes, tested backups/restores, dependency resilience and measured SLOs. These are not implemented</text><text x="86" y="1546" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#536479">recovery guarantees.</text></svg>