ext x="810" y="1167" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">ProjectPublication</text><line x1="790" y1="1178" x2="1320" y2="1178" stroke="#25866B" /><text x="810" y="1206" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">projectId: Long</text><text x="810" y="1233" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">slug: UUID (unique)</text><text x="810" y="1260" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">active: boolean</text><text x="810" y="1287" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">snapshot: String (JSON)</text><rect x="1610" y="270" width="490" height="185" rx="16" fill="#FFF5DD" stroke="#B78222" stroke-width="2" /><text x="1630" y="317" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">ChatSession</text><line x1="1610" y1="328" x2="2100" y2="328" stroke="#B78222" /><text x="1630" y="356" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">id: ChatSessionId</text><text x="1630" y="383" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">projectId + userId</text><rect x="1610" y="680" width="490" height="245" rx="16" fill="#FFF5DD" stroke="#B78222" stroke-width="2" /><text x="1630" y="727" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">ChatMessage</text><line x1="1610" y1="738" x2="2100" y2="738" stroke="#B78222" /><text x="1630" y="766" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">id: Long</text><text x="1630" y="793" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">chatSession: ChatSession</text><text x="1630" y="820" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">content: String</text><text x="1630" y="847" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">tokensUsed: Integer</text><rect x="1610" y="1160" width="490" height="245" rx="16" fill="#FFF5DD" stroke="#B78222" stroke-width="2" /><text x="1630" y="1207" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">ChatEvent</text><line x1="1610" y1="1218" x2="2100" y2="1218" stroke="#B78222" /><text x="1630" y="1246" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">id: Long</text><text x="1630" y="1273" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">chatMessage: ChatMessage</text><text x="1630" y="1300" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">sagaId: String</text><text x="1630" y="1327" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">status: ChatEventStatus</text><text x="66" y="74" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#203247">17 UML class view: core domain objects and associations</text><text x="66" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Solid lines are associations; endpoint labels show multiplicity. Attributes are a selected source-backed subset, not the full Java API.</text><text x="336" y="515" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">1</text><text x="336" y="620" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">0..*</text><text x="336" y="1075" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">1</text><text x="336" y="947" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">0..*</text><text x="806" y="535" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">1</text><text x="706" y="635" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">0..*</text><text x="1226" y="535" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">1</text><text x="1286" y="635" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">0..*</text><text x="1336" y="407" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">1</text><text x="1336" y="1270" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">0..1</text><text x="1886" y="515" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">1</text><text x="1886" y="645" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">0..*</text><text x="1886" y="970" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">1</text><text x="1886" y="1125" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">0..*</text><text x="666" y="1460" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#536479">Create establishes an OWNER even though the schema permits zero member</text><text x="666" y="1487" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#536479">rows. Publication shares the project primary key. File uniqueness is (projectId,</text><text x="666" y="1514" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#536479">path).</text><text x="96" y="1616" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Other domain records: UsageLog stores one user/date token count; ProcessedEvent stores a handled sagaId. See the ER/data ownership view for these tables.</text><text x="96" y="1701" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Remote userId/projectId and sagaId links are logical references across service-owned databases, not cross-database foreign keys.</text></svg>