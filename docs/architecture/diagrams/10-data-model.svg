<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1270" viewBox="0 0 1200 1270" role="img" aria-label="10  Data ownership and relationships"><title>10  Data ownership and relationships</title><desc>Logical data model: one service owns each database; other services use APIs or events. Cross-service userId/projectId values are logical references, not cross-database foreign keys. MinIO stores file bytes; Redis is not the project database.</desc><rect width="100%" height="100%" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60778c" /></marker><marker id="async-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b78222" /></marker></defs><text x="60" y="61" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#23364b" text-anchor="start">10  Data ownership and relationships</text><text x="60" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526278" text-anchor="start">Logical data model: one service owns each database; other services use APIs or events.</text><polyline points="220.0,315 220.0,440" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="125.0" y="356" width="190.0" height="27" rx="5" fill="white" /><text x="220" y="375" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="middle">1 user : many records</text><polyline points="220.0,785 220.0,625" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="125.5" y="691" width="189.0" height="27" rx="5" fill="white" /><text x="220" y="710" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="middle">1 plan : many records</text><polyline points="600.0,315 600.0,410" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="557.5" y="346" width="85.0" height="27" rx="5" fill="white" /><text x="600" y="365" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="middle">1 : many</text><polyline points="440,242.5 413,242 413,693 440,692.5" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="760,242.5 785,242 785,898 760,897.5" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="980.0,315 980.0,440" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="937.5" y="356" width="85.0" height="27" rx="5" fill="white" /><text x="980" y="375" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="middle">1 : many</text><polyline points="980.0,585 980.0,710" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="937.5" y="626" width="85.0" height="27" rx="5" fill="white" /><text x="980" y="645" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="middle">1 : many</text><rect x="60" y="170" width="320" height="145" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="78" y="211" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">users</text><text x="78" y="245" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">PK id</text><text x="78" y="269" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">username, password hash</text><text x="78" y="293" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">name, lifecycle timestamps</text><rect x="60" y="440" width="320" height="185" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="78" y="481" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">subscription</text><text x="78" y="516" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">PK id</text><text x="78" y="541" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">FK user_id -&gt; users</text><text x="78" y="566" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">FK plan_id -&gt; plan</text><text x="78" y="591" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">status and period</text><rect x="60" y="785" width="320" height="155" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="78" y="826" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">plan</text><text x="78" y="861" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">PK id</text><text x="78" y="886" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">max_projects, daily tokens</text><text x="78" y="911" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">provider billing reference</text><rect x="440" y="170" width="320" height="145" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="458" y="211" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">projects</text><text x="458" y="245" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">PK id</text><text x="458" y="269" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">name, deleted_at</text><text x="458" y="293" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">The root of a workspace</text><rect x="440" y="410" width="320" height="150" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="458" y="451" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">project_members</text><text x="458" y="486" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">PK (project_id, user_id)</text><text x="458" y="511" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">FK project_id</text><text x="458" y="536" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">OWNER / EDITOR / VIEWER</text><rect x="440" y="620" width="320" height="145" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="458" y="661" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">project_files</text><text x="458" y="695" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">PK id; FK project_id</text><text x="458" y="719" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">Unique (project_id, path)</text><text x="458" y="743" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">MinIO object key</text><rect x="440" y="825" width="320" height="145" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="458" y="866" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">project_publications</text><text x="458" y="900" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">PK/FK project_id; unique slug</text><text x="458" y="924" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">active, published_at</text><text x="458" y="948" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">snapshot: frontend JSON</text><rect x="440" y="1030" width="320" height="120" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="458" y="1071" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">processed_events</text><text x="458" y="1105" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">PK saga_id</text><text x="458" y="1129" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#23364b" text-anchor="start">Duplicate-request marker</text><rect x="820" y="170" width="320" height="145" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="838" y="211" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">chat_sessions</text><text x="838" y="246" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">PK (project_id, user_id)</text><text x="838" y="271" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">One user/project session</text><rect x="820" y="440" width="320" height="145" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="838" y="481" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">chat_messages</text><text x="838" y="516" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">PK id; FK session key</text><text x="838" y="541" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">role, content, tokens_used</text><rect x="820" y="710" width="320" height="160" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="838" y="751" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">chat_events</text><text x="838" y="786" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">PK id; FK chat_message_id</text><text x="838" y="811" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">type, content, file_path</text><text x="838" y="836" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">saga_id, status, ordering</text><rect x="820" y="1000" width="320" height="140" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="838" y="1041" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">usage_logs</text><text x="838" y="1076" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">PK id; unique (user_id, date)</text><text x="838" y="1101" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">Daily tokens_used</text><text x="60" y="140" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526278" text-anchor="start">ACCOUNT DATABASE</text><text x="440" y="140" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526278" text-anchor="start">WORKSPACE DATABASE</text><text x="820" y="140" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526278" text-anchor="start">INTELLIGENCE DATABASE</text><text x="60" y="1175" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">Workspace child cardinality: members/files = many; publication = zero or one.</text><line x1="60" y1="1185" x2="1140" y2="1185" stroke="#dde4ec" /><text x="60" y="1219" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">Cross-service userId/projectId values are logical references, not cross-database foreign keys. MinIO stores file bytes; Redis is not the</text><text x="60" y="1242" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">project database.</text></svg>