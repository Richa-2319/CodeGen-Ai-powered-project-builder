"886" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">:80 → :8080</text><text x="200" y="913" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">nginx static files + API proxy</text><rect x="860" y="800" width="480" height="180" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="880" y="847" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Service → gateway pod ×1</text><text x="880" y="886" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">:80 → :8080</text><text x="880" y="913" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Routes the three service prefixes</text><rect x="1550" y="795" width="500" height="205" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="1570" y="842" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Three Services / Deployments</text><text x="1570" y="881" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Account :80 → :9050 ×1</text><text x="1570" y="908" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Workspace :80 → :9020 ×1</text><text x="1570" y="935" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Intelligence :80 → :9030 ×1</text><rect x="160" y="1320" width="430" height="190" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="180" y="1367" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">PostgreSQL StatefulSet ×1</text><text x="180" y="1406" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">:5432; three logical databases</text><text x="180" y="1433" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">50 GiB oci-bv PVC</text><rect x="655" y="1320" width="440" height="190" rx="16" fill="#FFF5DD" stroke="#B78222" stroke-width="2" /><text x="675" y="1367" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Kafka StatefulSet ×1</text><text x="675" y="1406" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">:9092 broker / :29093 controller</text><text x="675" y="1433" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">50 GiB oci-bv PVC</text><rect x="1160" y="1320" width="430" height="190" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="1180" y="1367" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">MinIO StatefulSet ×1</text><text x="1180" y="1406" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">:9000 API / :9001 console</text><text x="1180" y="1433" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">50 GiB oci-bv PVC</text><rect x="1660" y="1320" width="395" height="190" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="1680" y="1367" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Redis StatefulSet ×1</text><text x="1680" y="1406" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">:6379; 256 MiB emptyDir</text><text x="1680" y="1433" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Optional runner route cache</text><rect x="170" y="1035" width="585" height="205" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="190" y="1082" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Runtime configuration</text><text x="190" y="1121" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Kubernetes Secrets + ConfigMaps</text><text x="190" y="1148" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Image references and service DNS</text><text x="190" y="1175" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Preview runner execution disabled</text><rect x="1190" y="1580" width="580" height="150" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="1210" y="1627" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">MinIO initialization Job</text><text x="1210" y="1666" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Creates the projects bucket</text><text x="1210" y="1693" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Runs separately from 9 steady pods</text><text x="66" y="74" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#203247">22 Kubernetes deployment: checked-in Basic OKE demo topology</text><text x="66" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Template view, not a live cluster inventory. Namespace codegen-core runs on one private A1 worker: 2 OCPU, 12 GB RAM and 50 GB boot.</text><text x="966" y="1055" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">Application Services :80 → pods</text><text x="816" y="1204" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#B78222">Intelligence ↔ Workspace file events</text><text x="1126" y="1144" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#8461B3">Workspace file contents</text><text x="1961" y="1137" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#8461B3">Workspace</text><text x="1961" y="1161" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#8461B3">optional route cache</text><text x="146" y="1796" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">NAT egress: image pulls and the configured AI provider. Included NetworkPolicies are not enforced by the demo Flannel network. Do not infer namespace isolation from YAML alone.</text><text x="66" y="1936" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Production overlay: 5 application Deployments ×2; bundled stateful resources excluded; external dependencies required. No HPA or multi-node placement policy is provisioned by this overlay.</text></svg>