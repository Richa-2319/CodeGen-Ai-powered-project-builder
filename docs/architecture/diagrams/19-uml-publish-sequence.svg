<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1800" viewBox="0 0 2300 1800" role="img" aria-label="19  UML sequence: publish a snapshot, then read it anonymously"><title>19  UML sequence: publish a snapshot, then read it anonymously</title><desc>Component dataflow with labeled directional connectors. See the accompanying microservice dataflow guide for payload and source details.</desc><rect width="100%" height="100%" fill="#FFFFFF" /><defs><marker id="arrow3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3878C5" /></marker><marker id="open3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#3878C5" /></marker><marker id="arrow25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25866B" /></marker><marker id="open25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#25866B" /></marker><marker id="arrow8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8461B3" /></marker><marker id="open8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#8461B3" /></marker><marker id="arrowB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B78222" /></marker><marker id="openB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#B78222" /></marker></defs><polyline points="160.0,290.0 160.0,1650.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" /><polyline points="655.0,290.0 655.0,1650.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" /><polyline points="1150.0,290.0 1150.0,1650.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" /><polyline points="1645.0,290.0 1645.0,1650.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" /><polyline points="2140.0,290.0 2140.0,1650.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" /><polyline points="160.0,355.0 655.0,355.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="655.0,559.0 1645.0,559.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="1645.0,661.0 655.0,661.0" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" stroke-dasharray="10 7" /><polyline points="655.0,763.0 1150.0,763.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="1150.0,865.0 655.0,865.0" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" stroke-dasharray="10 7" /><polyline points="655.0,967.0 1645.0,967.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="1645.0,1069.0 655.0,1069.0" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" stroke-dasharray="10 7" /><polyline points="655.0,1171.0 160.0,1171.0" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" stroke-dasharray="10 7" /><polyline points="2140.0,1273.0 655.0,1273.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="655.0,1375.0 1645.0,1375.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="1645.0,1477.0 655.0,1477.0" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" stroke-dasharray="10 7" /><polyline points="655.0,1579.0 2140.0,1579.0" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" stroke-dasharray="10 7" /><rect x="35.0" y="180" width="250" height="110" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="55.0" y="227" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Owner browser</text><rect x="530.0" y="180" width="250" height="110" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="550.0" y="227" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Workspace</text><rect x="1025.0" y="180" width="250" height="110" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="1045.0" y="227" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">MinIO</text><rect x="1520.0" y="180" width="250" height="110" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="1540.0" y="227" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Workspace DB</text><rect x="2015.0" y="180" width="250" height="110" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="2035.0" y="227" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Visitor browser</text><text x="66" y="74" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#203247">19 UML sequence: publish a snapshot, then read it anonymously</text><text x="66" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">HTTP messages shown here pass through nginx and the API gateway. Those transparent hops are omitted for readability.</text><text x="180.0" y="317" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#3878C5">1 · POST publication</text><rect x="450" y="435" width="1760" height="65" rx="5" fill="#FFFFFF" /><text x="456" y="461" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Workspace checks OWNER permission, then begins the publication transaction.</text><text x="675.0" y="521" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#3878C5">2 · Lock active project; read saved-file metadata</text><text x="675.0" y="623" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25866B">3 · Active project + permitted file keys</text><text x="675.0" y="725" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#3878C5">4 · Read saved file bytes</text><text x="675.0" y="827" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25866B">5 · Frontend source files</text><text x="675.0" y="929" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#3878C5">6 · Validate entrypoint; save snapshot JSON + active slug</text><text x="675.0" y="1031" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25866B">7 · Publication committed</text><text x="180.0" y="1133" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25866B">8 · Slug/status; UI builds /p/{slug}</text><text x="675.0" y="1235" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#3878C5">9 · GET /workspace/public/apps/{slug}</text><text x="675.0" y="1337" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#3878C5">10 · Require active publication and nondeleted project</text><text x="675.0" y="1439" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25866B">11 · Stored snapshot JSON</text><text x="675.0" y="1541" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25866B">12 · Public frontend bundle; render in sandbox</text><text x="66" y="1739" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Republish replaces the saved snapshot and preserves the slug. Public reads use that snapshot rather than current MinIO files. Unpublish blocks subsequent public reads.</text></svg>