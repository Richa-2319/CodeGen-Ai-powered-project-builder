<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-label="05  AI generation and live browser updates"><title>05  AI generation and live browser updates</title><desc>Streaming text and durable file delivery are different parts of the request. SSE = server-sent events. The prompt uses the current message and project files; stored chat history is a separate read API.</desc><rect width="100%" height="100%" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60778c" /></marker><marker id="async-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b78222" /></marker></defs><text x="60" y="61" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#23364b" text-anchor="start">05  AI generation and live browser updates</text><text x="60" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526278" text-anchor="start">Streaming text and durable file delivery are different parts of the request.</text><polyline points="380,245.0 440,245.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="760,245.0 820,245.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="980.0,330 980.0,415" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="820,500.0 760,500.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="440,500.0 380,500.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="220.0,585 220.0,670" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="380,755.0 440,755.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="760,755.0 820,755.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="60" y="160" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="78" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">01 Send a prompt</text><text x="78" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">POST</text><text x="78" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">/intelligence/chat/stream with</text><text x="78" y="289" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">projectId and message.</text><rect x="440" y="160" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="458" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">02 Verify project access</text><text x="458" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Intelligence asks Workspace</text><text x="458" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">whether this user can EDIT.</text><rect x="820" y="160" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="838" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">03 Check daily allowance</text><text x="838" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Read Account plan and</text><text x="838" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">today's intelligence usage</text><text x="838" y="289" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">before starting.</text><rect x="820" y="415" width="320" height="170" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="838" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">04 Prepare the session</text><text x="838" y="492" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Find/create a project-user</text><text x="838" y="518" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">chat session; retain caller</text><text x="838" y="544" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">identity for async work.</text><rect x="440" y="415" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="458" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">05 Build project context</text><text x="458" y="492" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Fetch the file tree. The model</text><text x="458" y="518" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">can use read_files for saved</text><text x="458" y="544" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">file contents.</text><rect x="60" y="415" width="320" height="170" rx="14" fill="#fff5dd" stroke="#b78222" stroke-width="1.8" /><text x="78" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">06 Stream from the model</text><text x="78" y="492" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Spring AI calls the configured</text><text x="78" y="518" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">compatible provider and</text><text x="78" y="544" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">model.</text><rect x="60" y="670" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="78" y="711" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">07 Update the editor</text><text x="78" y="747" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">SSE chunks update chat and</text><text x="78" y="773" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">parsed file edits in browser</text><text x="78" y="799" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">memory.</text><rect x="440" y="670" width="320" height="170" rx="14" fill="#fff5dd" stroke="#b78222" stroke-width="1.8" /><text x="458" y="711" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">08 Finish the text stream</text><text x="458" y="747" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Provider completion ends</text><text x="458" y="773" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">streaming; it does not prove</text><text x="458" y="799" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">files are durable.</text><rect x="820" y="670" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="838" y="711" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">09 Finalize in background</text><text x="838" y="747" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Record usage/messages,</text><text x="838" y="773" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">parse events, then start the</text><text x="838" y="799" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">file-delivery flow.</text><line x1="60" y1="968" x2="1140" y2="968" stroke="#dde4ec" /><text x="60" y="1002" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">SSE = server-sent events. The prompt uses the current message and project files; stored chat history is a separate read API.</text></svg>