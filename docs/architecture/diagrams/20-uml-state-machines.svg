y="180" width="2120" height="500" fill="#FBFCFE" stroke="#B7C3D1" stroke-width="2" stroke-dasharray="8 5" /><text x="66" y="213" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#536479">FILE_EDIT delivery status</text><rect x="50" y="730" width="2120" height="520" fill="#FBFCFE" stroke="#B7C3D1" stroke-width="2" stroke-dasharray="8 5" /><text x="66" y="763" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#536479">Publication lifecycle</text><rect x="50" y="1310" width="2120" height="460" fill="#FBFCFE" stroke="#B7C3D1" stroke-width="2" stroke-dasharray="8 5" /><text x="66" y="1343" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#536479">Project lifecycle</text><polyline points="140,365.0 420,365.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="870,323.75 1070,323.75 1070,312.5 1290,312.5" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" /><polyline points="870,411.25 1070,411.25 1070,542.5 1290,542.5" fill="none" stroke="#B78222" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowB78222)" /><polyline points="500,947.5 810,947.5" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="1290,913.75 1640,913.75" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="1640,981.25 1290,981.25" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" /><polyline points="1050,880.0 1050,800 1450,800 1450,1050 1050,1050 1050,1015.0" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" /><polyline points="500,1517.5 810,1517.5" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="1290,1517.5 1650,1517.5" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><ellipse cx="120.0" cy="365.0" rx="20.0" ry="20.0" fill="#203247" stroke="#8290A1" stroke-width="2" /><rect x="420" y="280" width="450" height="175" rx="16" fill="#FFF5DD" stroke="#B78222" stroke-width="2" /><text x="440" y="327" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">PENDING</text><text x="440" y="366" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Tracking committed before Kafka publish</text><rect x="1290" y="245" width="500" height="135" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="1310" y="292" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">CONFIRMED</text><text x="1310" y="331" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Success response received</text><rect x="1290" y="475" width="500" height="135" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="1310" y="522" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">FAILED</text><text x="1310" y="561" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Failed send or failure response</text><rect x="120" y="880" width="380" height="135" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="140" y="927" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">No publication</text><text x="140" y="966" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">No row yet</text><rect x="810" y="880" width="480" height="135" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="830" y="927" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Published</text><text x="830" y="966" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">active=true; saved snapshot</text><rect x="1640" y="880" width="430" height="135" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="1660" y="927" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Unpublished</text><text x="1660" y="966" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">active=false; slug retained</text><rect x="140" y="1450" width="360" height="135" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="160" y="1497" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Absent</text><text x="160" y="1536" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">No project</text><rect x="810" y="1450" width="480" height="135" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="830" y="1497" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Active</text><text x="830" y="1536" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">deletedAt is null</text><rect x="1650" y="1450" width="430" height="135" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="1670" y="1497" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Soft-deleted</text><text x="1670" y="1536" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">deletedAt is set</text><text x="66" y="74" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#203247">20 UML state machines: file events, publications and projects</text><text x="66" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Transitions are implemented operations. Project and publication states below are derived from records/flags, not additional enum values.</text><text x="156" y="335" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">parse FILE_EDIT</text><text x="906" y="280" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#25866B">success=true</text><text x="896" y="595" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#B78222">send fails / success=false</text><text x="106" y="645" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#536479">Responses for non-PENDING events are ignored. No FAILED → PENDING recovery transition is implemented here.</text><text x="521" y="919" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#3878C5">publish valid snapshot</text><text x="1346" y="880" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">unpublish</text><text x="1346" y="1045" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#25866B">publish again</text><text x="1106" y="770" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#25866B">republish: replace snapshot; keep slug</text><text x="116" y="1196" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Deleting the project independently blocks public lookup. It does not explicitly change the publication active flag.</text><text x="521" y="1415" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">create + OWNER membership</text><text x="1316" y="1475" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">authorized delete</text><text x="116" y="1686" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Rename and file edits leave the project Active. No restore or object-purge transition is implemented in this service.</text></svg>