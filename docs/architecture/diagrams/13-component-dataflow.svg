<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="1510" viewBox="0 0 2220 1510" role="img" aria-label="13  Component dataflow: from the browser to stored data"><title>13  Component dataflow: from the browser to stored data</title><desc>Component dataflow with labeled directional connectors. See the accompanying microservice dataflow guide for payload and source details.</desc><rect width="100%" height="100%" fill="#FFFFFF" /><defs><marker id="arrow3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3878C5" /></marker><marker id="open3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#3878C5" /></marker><marker id="arrow25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25866B" /></marker><marker id="open25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#25866B" /></marker><marker id="arrow8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8461B3" /></marker><marker id="open8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#8461B3" /></marker><marker id="arrowB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B78222" /></marker><marker id="openB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#B78222" /></marker></defs><polyline points="840,245.0 700,245 700,265 520,265.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" marker-start="url(#arrow3878C5)" /><polyline points="1080.0,320 1080.0,435" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" marker-start="url(#arrow3878C5)" /><polyline points="1080.0,585 1080.0,700" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" marker-start="url(#arrow3878C5)" /><polyline points="912.0,850 912,925 275,925 275.0,1050" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" marker-start="url(#arrow3878C5)" /><polyline points="1080.0,850 1080,925 955,925 955.0,1050" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" marker-start="url(#arrow3878C5)" /><polyline points="1248.0,850 1248,900 1745,900 1745.0,1050" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" marker-start="url(#arrow3878C5)" /><polyline points="275.0,1200 275.0,1340" fill="none" stroke="#8461B3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow8461B3)" marker-start="url(#arrow8461B3)" /><polyline points="867.5,1200 867.5,1290 775,1290 775.0,1340" fill="none" stroke="#8461B3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow8461B3)" marker-start="url(#arrow8461B3)" /><polyline points="1042.5,1200 1042.5,1270 1195,1270 1195.0,1340" fill="none" stroke="#8461B3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow8461B3)" marker-start="url(#arrow8461B3)" /><polyline points="1657.5,1200 1657.5,1280 1645,1280 1645.0,1340" fill="none" stroke="#8461B3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow8461B3)" marker-start="url(#arrow8461B3)" /><polyline points="1832.5,1200 1832.5,1270 2020,1270 2020.0,1340" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" marker-start="url(#arrow3878C5)" /><polyline points="1570,1125.0 1450,1125.0" fill="none" stroke="#B78222" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowB78222)" marker-start="url(#arrowB78222)" stroke-dasharray="10 7" /><polyline points="1230,1125.0 1130,1125.0" fill="none" stroke="#B78222" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowB78222)" marker-start="url(#arrowB78222)" stroke-dasharray="10 7" /><rect x="840" y="170" width="480" height="150" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="860" y="217" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">React app in the browser</text><text x="860" y="256" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Forms, prompts, editor and public app viewer</text><rect x="100" y="170" width="420" height="190" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="120" y="217" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Preview sandbox</text><text x="120" y="256" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Receives source files; returns</text><text x="120" y="283" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">ready/error status. No auth token is</text><text x="120" y="310" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">sent.</text><rect x="840" y="435" width="480" height="150" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="860" y="482" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Frontend nginx</text><text x="860" y="521" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Serves UI assets; proxies the three API route</text><text x="860" y="548" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">prefixes.</text><rect x="840" y="700" width="480" height="150" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="860" y="747" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">API gateway :8080</text><text x="860" y="786" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Validates user identity; routes requests and</text><text x="860" y="813" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">streams responses.</text><rect x="100" y="1050" width="350" height="150" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="120" y="1097" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Account :9050</text><text x="120" y="1136" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Identity, user lookup and current</text><text x="120" y="1163" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">plan</text><rect x="780" y="1050" width="350" height="150" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="800" y="1097" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Workspace :9020</text><text x="800" y="1136" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Projects, membership, files and</text><text x="800" y="1163" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">public snapshots</text><rect x="1570" y="1050" width="350" height="150" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="1590" y="1097" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Intelligence :9030</text><text x="1590" y="1136" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Model streaming, chat events</text><text x="1590" y="1163" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">and token usage</text><rect x="1230" y="1050" width="220" height="150" rx="16" fill="#FFF5DD" stroke="#B78222" stroke-width="2" /><text x="1250" y="1097" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Kafka</text><text x="1250" y="1136" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">File requests</text><text x="1250" y="1163" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">and save results</text><rect x="100" y="1340" width="350" height="150" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="120" y="1387" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">account_db</text><text x="120" y="1426" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Users, plans and subscriptions</text><rect x="610" y="1340" width="330" height="150" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="630" y="1387" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">workspace_db</text><text x="630" y="1426" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Projects, roles, file keys and</text><text x="630" y="1453" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">published snapshots</text><rect x="1030" y="1340" width="330" height="150" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="1050" y="1387" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">MinIO</text><text x="1050" y="1426" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Source bytes in projects /</text><text x="1050" y="1453" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">projectId/path</text><rect x="1480" y="1340" width="330" height="150" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="1500" y="1387" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">intelligence_db</text><text x="1500" y="1426" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Chat, file-event status and</text><text x="1500" y="1453" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">daily usage</text><rect x="1870" y="1340" width="300" height="150" rx="16" fill="#FFF5DD" stroke="#B78222" stroke-width="2" /><text x="1890" y="1387" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">AI provider</text><text x="1890" y="1426" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Configured endpoint and</text><text x="1890" y="1453" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">model</text><rect x="1680" y="170" width="480" height="260" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="1700" y="217" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">How to read this map</text><text x="1700" y="256" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Arrows at both ends = request and return</text><text x="1700" y="283" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">data.</text><text x="1700" y="310" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Blue = HTTP or browser messages.</text><text x="1700" y="337" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Purple = service-owned storage.</text><text x="1700" y="364" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Gold dashed = asynchronous Kafka</text><text x="1700" y="391" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">messages.</text><rect x="100" y="490" width="560" height="245" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="120" y="537" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Outside the default data path</text><text x="120" y="576" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Redis routes server preview runners, which are</text><text x="120" y="603" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">disabled by default. Config Server and Eureka are</text><text x="120" y="630" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">optional. common-lib is shared code, not a running</text><text x="120" y="657" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">service.</text><text x="66" y="74" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#203247">13 Component dataflow: from the browser to stored data</text><text x="66" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Follow the labeled connections. Page 14 expands internal HTTP calls; page 15 expands Kafka requests and results.</text><text x="531" y="182" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203247">postMessage</text><text x="531" y="208" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203247">source files + runId / status</text><text x="1116" y="369" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">HTTP request / UI assets, JSON or SSE</text><text x="1116" y="635" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Same-origin API proxy</text><text x="1116" y="662" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">JSON, file bytes and SSE pass through</text><text x="106" y="980" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">/account/**</text><text x="106" y="1007" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">signup/login, profile and plan</text><text x="636" y="980" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">/workspace/**</text><text x="636" y="1007" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">projects, files, preview and publication</text><text x="1536" y="980" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">/intelligence/**</text><text x="1536" y="1007" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">prompt, SSE chunks, history and usage</text><rect x="110" y="1250" width="325" height="43" rx="5" fill="#FFFFFF" /><text x="116" y="1275" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#8461B3">SQL records / rows</text><rect x="555" y="1230" width="395" height="42" rx="5" fill="#FFFFFF" /><text x="561" y="1254" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#8461B3">SQL metadata / snapshots</text><rect x="1000" y="1285" width="390" height="42" rx="5" fill="#FFFFFF" /><text x="1006" y="1309" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#8461B3">S3 API: PUT / GET bytes</text><rect x="1450" y="1230" width="385" height="42" rx="5" fill="#FFFFFF" /><text x="1456" y="1254" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#8461B3">SQL records / status</text><rect x="1830" y="1285" width="385" height="42" rx="5" fill="#FFFFFF" /><text x="1836" y="1308" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#3878C5">HTTPS prompt / streamed text</text><text x="1466" y="735" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#B78222">Kafka: Intelligence → Workspace = file edits</text><text x="1466" y="762" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#B78222">Workspace → Intelligence = save results</text><text x="106" y="811" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Storage ownership: only the owning microservice accesses its</text><text x="106" y="839" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">database. Other services use the APIs and events shown on pages</text><text x="106" y="867" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">14–15.</text></svg>