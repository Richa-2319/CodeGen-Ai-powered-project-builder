<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="1880" viewBox="0 0 2220 1880" role="img" aria-label="26  Kubernetes platform components behind the application"><title>26  Kubernetes platform components behind the application</title><desc>Component dataflow with labeled directional connectors. See the accompanying microservice dataflow guide for payload and source details.</desc><rect width="100%" height="100%" fill="#FFFFFF" /><defs><marker id="arrow3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3878C5" /></marker><marker id="open3878C5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#3878C5" /></marker><marker id="arrow25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25866B" /></marker><marker id="open25866B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#25866B" /></marker><marker id="arrow8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8461B3" /></marker><marker id="open8461B3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#8461B3" /></marker><marker id="arrowB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B78222" /></marker><marker id="openB78222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#B78222" /></marker></defs><rect x="60" y="190" width="1370" height="625" fill="#FBFCFE" stroke="#B7C3D1" stroke-width="2" stroke-dasharray="8 5" /><text x="76" y="223" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#536479">Managed control plane</text><rect x="60" y="900" width="2100" height="850" fill="#FBFCFE" stroke="#B7C3D1" stroke-width="2" stroke-dasharray="8 5" /><text x="76" y="933" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#536479">Managed worker node and cluster add-ons</text><polyline points="615.0,470 615,535 295,535 295.0,595" fill="none" stroke="#8461B3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow8461B3)" marker-start="url(#arrow8461B3)" /><polyline points="745.0,595 745,535 750,535 750.0,470" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" marker-start="url(#arrow3878C5)" /><polyline points="1190.0,580 1190,515 885,515 885.0,470" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" marker-start="url(#arrow3878C5)" /><polyline points="1530,385.0 1450,385 975,385.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" marker-start="url(#arrow3878C5)" /><polyline points="525,385.0 85,385 85,1105 120,1105.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" marker-start="url(#arrow3878C5)" /><polyline points="530,1105.0 750,1105.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" marker-start="url(#arrow3878C5)" /><polyline points="1190,1105.0 1440,1105.0" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="1895.0,1200 1895,1360 1865,1360 1865.0,1460" fill="none" stroke="#8461B3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow8461B3)" marker-start="url(#arrow8461B3)" /><polyline points="1570.0,1200 1570,1320 835,1320 835.0,1460" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" marker-start="url(#arrow3878C5)" /><polyline points="1835.0,775 1835,850 2190,850 2190,1562.5 2090,1562.5" fill="none" stroke="#8461B3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow8461B3)" marker-start="url(#arrow8461B3)" /><rect x="525" y="300" width="450" height="170" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="545" y="347" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">kube-apiserver</text><text x="545" y="386" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Validates Kubernetes API objects;</text><text x="545" y="413" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">exposes cluster state</text><rect x="100" y="595" width="390" height="155" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="120" y="642" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">etcd</text><text x="120" y="681" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Persists Kubernetes object state</text><rect x="535" y="595" width="420" height="155" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="555" y="642" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">kube-scheduler</text><text x="555" y="681" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Selects a node for an unscheduled Pod</text><rect x="1005" y="580" width="370" height="200" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="1025" y="627" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Controller manager</text><text x="1025" y="666" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Reconciles Deployments,</text><text x="1025" y="693" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">ReplicaSets, Jobs and other</text><text x="1025" y="720" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">objects</text><rect x="1530" y="285" width="610" height="200" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="1550" y="332" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">OCI cloud integration</text><text x="1550" y="371" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Cloud-controller-manager integrates Kubernetes with OCI</text><text x="1550" y="398" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">resources where configured</text><rect x="1530" y="585" width="610" height="190" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="1550" y="632" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">OCI block storage</text><text x="1550" y="671" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">oci-bv StorageClass is referenced by three demo PVCs; the</text><text x="1550" y="698" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">cluster supplies provisioning</text><rect x="120" y="1010" width="410" height="190" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="140" y="1057" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">kubelet</text><text x="140" y="1096" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Watches assigned Pods and</text><text x="140" y="1123" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">maintains their container lifecycle</text><rect x="750" y="1010" width="440" height="190" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="770" y="1057" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Container runtime</text><text x="770" y="1096" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Pulls images and starts containers for the</text><text x="770" y="1123" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">kubelet</text><rect x="1440" y="1010" width="650" height="190" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="1460" y="1057" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">CodeGen Pods</text><text x="1460" y="1096" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">5 application pods + 4 stateful pods in the demo</text><text x="1460" y="1123" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">A separate minio-init Job creates an initialization pod</text><rect x="120" y="1460" width="430" height="205" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="140" y="1507" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Service networking</text><text x="140" y="1546" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">kube-proxy or an equivalent</text><text x="140" y="1573" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">implementation routes ClusterIP Service</text><text x="140" y="1600" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">traffic to Pod endpoints</text><rect x="620" y="1460" width="430" height="205" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="640" y="1507" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Cluster DNS</text><text x="640" y="1546" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Typically CoreDNS resolves service</text><text x="640" y="1573" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">names such as workspace-service</text><rect x="1120" y="1460" width="450" height="205" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="1140" y="1507" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Pod networking / CNI</text><text x="1140" y="1546" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Demo template selects Flannel. It provides</text><text x="1140" y="1573" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">connectivity; it does not enforce</text><text x="1140" y="1600" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">NetworkPolicies.</text><rect x="1640" y="1460" width="450" height="205" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="1660" y="1507" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">CSI storage integration</text><text x="1660" y="1546" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Binds/mounts PVC-backed volumes for</text><text x="1660" y="1573" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">PostgreSQL, Kafka and MinIO pods</text><text x="66" y="74" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#203247">26 Kubernetes platform components behind the application</text><text x="66" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Conceptual Kubernetes / OKE responsibilities. These platform components are managed or supplied by the cluster, not created by CodeGen manifests.</text><text x="141" y="841" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Controller flow: desired objects → reconciliation → scheduling → kubelet → running containers. Application request traffic follows the Services and Ingress shown on</text><text x="141" y="869" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">page 22.</text><text x="76" y="1806" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Ingress controller, metrics collection, centralized logs and backup tooling require explicit setup. Their installation and live health are not verified by these source diagrams.</text></svg>