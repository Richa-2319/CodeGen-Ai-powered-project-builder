y="180" width="660" height="1680" fill="#FBFCFE" stroke="#B7C3D1" stroke-width="2" stroke-dasharray="8 5" /><text x="66" y="213" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#536479">Browser / user</text><rect x="780" y="180" width="660" height="1680" fill="#FBFCFE" stroke="#B7C3D1" stroke-width="2" stroke-dasharray="8 5" /><text x="796" y="213" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#536479">API and domain services</text><rect x="1510" y="180" width="660" height="1680" fill="#FBFCFE" stroke="#B7C3D1" stroke-width="2" stroke-dasharray="8 5" /><text x="1526" y="213" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#536479">Background delivery</text><polyline points="370.0,285 370,325 380,325 380.0,370" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="640,445.0 730,445 730,447.5 880,447.5" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="880,493.75 735,493.75 735,755 640,755.0" fill="none" stroke="#B78222" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowB78222)" /><polyline points="1107.5,540 1107.5,630 1110,630 1110.0,720" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="850,832.0 725,832 725,1110 640,1110.0" fill="none" stroke="#25866B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow25866B)" /><polyline points="1370,800.0 1840,800 1840.0,1050" fill="none" stroke="#B78222" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowB78222)" stroke-dasharray="10 7" /><polyline points="1840.0,1210 1840.0,1390" fill="none" stroke="#B78222" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowB78222)" stroke-dasharray="10 7" /><polyline points="1840.0,1550 1840.0,1670" fill="none" stroke="#8461B3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow8461B3)" /><polyline points="380.0,1190 380.0,1430" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><polyline points="380.0,1600 380.0,1730" fill="none" stroke="#3878C5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow3878C5)" /><ellipse cx="370.0" cy="265.0" rx="20.0" ry="20.0" fill="#203247" stroke="#8290A1" stroke-width="2" /><rect x="120" y="370" width="520" height="150" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="140" y="417" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Send project prompt</text><text x="140" y="456" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Signed-in user submits projectId + message</text><polygon points="1107.5,355 1335,447.5 1107.5,540 880,447.5" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="958.5" y="457.0" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Permission + allowance?</text><rect x="120" y="680" width="520" height="150" rx="16" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><text x="140" y="727" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Show request error</text><text x="140" y="766" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Access or allowance check failed</text><rect x="850" y="720" width="520" height="160" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="870" y="767" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Generate with project context</text><text x="870" y="806" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Read tree / optional saved files; stream model</text><text x="870" y="833" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">output</text><rect x="120" y="1030" width="520" height="160" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="140" y="1077" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Apply streamed file edits</text><text x="140" y="1116" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Chat, editor and file tree update in memory</text><rect x="1580" y="1050" width="520" height="160" rx="16" fill="#E8F6F1" stroke="#25866B" stroke-width="2" /><text x="1600" y="1097" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Finalize completed output</text><text x="1600" y="1136" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Record usage, messages and events; commit</text><text x="1600" y="1163" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">PENDING</text><rect x="1580" y="1390" width="520" height="160" rx="16" fill="#FFF5DD" stroke="#B78222" stroke-width="2" /><text x="1600" y="1437" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Persist generated files</text><text x="1600" y="1476" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Kafka request → MinIO + metadata → result</text><rect x="1580" y="1670" width="520" height="150" rx="16" fill="#F1EDFB" stroke="#8461B3" stroke-width="2" /><text x="1600" y="1717" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Result status</text><text x="1600" y="1756" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">CONFIRMED or FAILED in intelligence_db</text><rect x="120" y="1430" width="520" height="170" rx="16" fill="#EAF2FF" stroke="#3878C5" stroke-width="2" /><text x="140" y="1477" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203247">Request saved preview bundle</text><text x="140" y="1516" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203247">Merge recent edits; run isolated browser frame</text><ellipse cx="380.0" cy="1750.0" rx="20.0" ry="20.0" fill="#F3F5F8" stroke="#8290A1" stroke-width="2" /><ellipse cx="380.0" cy="1750.0" rx="13.0" ry="13.0" fill="#203247" /><text x="66" y="74" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#203247">21 UML activity: user intent, decisions and asynchronous work</text><text x="66" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">Swimlanes assign responsibility. Diamonds are decisions. The UI stream and background file delivery complete independently.</text><text x="741" y="625" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#B78222">No</text><text x="1136" y="640" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">Yes</text><text x="666" y="925" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#25866B">SSE chunks</text><text x="1436" y="710" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#B78222">On provider completion:</text><text x="1436" y="737" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#B78222">schedule background work</text><text x="161" y="1315" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#3878C5">User selects Preview</text><text x="811" y="1262" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#536479">No join waits for storage completion before the original SSE</text><text x="811" y="1291" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#536479">closes. Preview can merge local edits before saved files</text><text x="811" y="1320" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#536479">become available.</text><text x="66" y="1916" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536479">An initial/final activity marker describes this diagram’s scope; it does not add a persisted application status.</text></svg>