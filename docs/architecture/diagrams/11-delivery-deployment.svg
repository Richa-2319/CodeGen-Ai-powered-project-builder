<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1270" viewBox="0 0 1200 1270" role="img" aria-label="11  Build, release and run the application"><title>11  Build, release and run the application</title><desc>Deployment options are templates; a Git push does not automatically deploy to the cloud. For every target: configure secrets privately, preserve data, verify DNS/TLS and test login + generation from the intended user network.</desc><rect width="100%" height="100%" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60778c" /></marker><marker id="async-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b78222" /></marker></defs><text x="60" y="61" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#23364b" text-anchor="start">11  Build, release and run the application</text><text x="60" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526278" text-anchor="start">Deployment options are templates; a Git push does not automatically deploy to the cloud.</text><polyline points="380,240.0 440,240.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="760,240.0 820,240.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 6" /><polyline points="980.0,325 980.0,430" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="820,515.0 760,515.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="600.0,600 600,660 220,660 220.0,720" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="600.0,600 600.0,720" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="600.0,600 600,640 980,640 980.0,720" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="220.0,905 220,965 600,965 600.0,1020" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="600.0,905 600.0,1020" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="980.0,905 980,985 600,985 600.0,1020" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="60" y="155" width="320" height="170" rx="14" fill="#f1f3f6" stroke="#7a8796" stroke-width="1.8" /><text x="78" y="196" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Commit reviewed source</text><text x="78" y="232" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">The repository keeps code,</text><text x="78" y="258" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">tests and deployment</text><text x="78" y="284" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">templates.</text><rect x="440" y="155" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="458" y="196" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">CI on push / pull request</text><text x="458" y="232" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Java 21 build/tests, frontend</text><text x="458" y="258" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">validation and manifest</text><text x="458" y="284" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">checks.</text><rect x="820" y="155" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="838" y="196" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Manual image release</text><text x="838" y="232" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Reviewed tag + architecture;</text><text x="838" y="258" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">verify before image</text><text x="838" y="284" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">publication.</text><rect x="820" y="430" width="320" height="170" rx="14" fill="#f1edfb" stroke="#8461b3" stroke-width="1.8" /><text x="838" y="471" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Authorized registry</text><text x="838" y="507" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Five application images with</text><text x="838" y="533" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">immutable deployment</text><text x="838" y="559" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">digests.</text><rect x="440" y="430" width="320" height="170" rx="14" fill="#f1f3f6" stroke="#7a8796" stroke-width="1.8" /><text x="458" y="471" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Choose a deployment</text><text x="458" y="507" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Select one target design and</text><text x="458" y="533" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">prepare its runtime</text><text x="458" y="559" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">configuration.</text><rect x="60" y="720" width="320" height="185" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="78" y="761" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Single-host Compose</text><text x="78" y="797" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Nine components + init job</text><text x="78" y="823" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Named volumes and DNS</text><text x="78" y="849" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Optional Caddy HTTPS</text><rect x="440" y="720" width="320" height="185" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="458" y="761" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Basic OKE demo</text><text x="458" y="797" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">One private A1 worker</text><text x="458" y="823" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">2 OCPU / 12 GB template</text><text x="458" y="849" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Three 50Gi application PVCs</text><rect x="820" y="720" width="320" height="185" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="838" y="761" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Production overlay</text><text x="838" y="797" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Replicated stateless services</text><text x="838" y="823" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Managed</text><text x="838" y="849" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">database/broker/cache</text><text x="838" y="875" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Managed object storage</text><rect x="440" y="1020" width="320" height="140" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="458" y="1061" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Verify the selected target</text><text x="458" y="1094" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">Readiness, data writes, restore</text><text x="458" y="1117" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">plan, provider access and external</text><text x="458" y="1140" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#23364b" text-anchor="start">HTTPS.</text><text x="60" y="690" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">Alternative targets (choose one)</text><line x1="60" y1="1208" x2="1140" y2="1208" stroke="#dde4ec" /><text x="60" y="1242" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">For every target: configure secrets privately, preserve data, verify DNS/TLS and test login + generation from the intended user network.</text></svg>