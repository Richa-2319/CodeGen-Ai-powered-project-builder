<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-label="03  Signup, login and authenticated requests"><title>03  Signup, login and authenticated requests</title><desc>A user identity is created once, then checked again on protected requests. JWT = signed user identity. A service key identifies internal callers; it does not replace project permissions.</desc><rect width="100%" height="100%" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60778c" /></marker><marker id="async-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b78222" /></marker></defs><text x="60" y="61" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#23364b" text-anchor="start">03  Signup, login and authenticated requests</text><text x="60" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526278" text-anchor="start">A user identity is created once, then checked again on protected requests.</text><polyline points="380,245.0 440,245.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="760,245.0 820,245.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="980.0,330 980.0,415" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="820,500.0 760,500.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="440,500.0 380,500.0" fill="none" stroke="#60778c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="60" y="160" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="78" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">01 Use the login form</text><text x="78" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">The browser sends signup or</text><text x="78" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">login data to /account/auth/.</text><rect x="440" y="160" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="458" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">02 Pass the public route</text><text x="458" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">nginx forwards to the</text><text x="458" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">gateway; signup/login do not</text><text x="458" y="289" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">need a JWT.</text><rect x="820" y="160" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="838" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">03 Check the account</text><text x="838" y="237" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Account service hashes a</text><text x="838" y="263" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">new password or verifies an</text><text x="838" y="289" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">existing user.</text><rect x="820" y="415" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="838" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">04 Return a signed JWT</text><text x="838" y="492" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Account service returns the</text><text x="838" y="518" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">token and a small user</text><text x="838" y="544" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">profile.</text><rect x="440" y="415" width="320" height="170" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="458" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">05 Remember the login</text><text x="458" y="492" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">The frontend stores</text><text x="458" y="518" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">authentication state in</text><text x="458" y="544" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">browser localStorage.</text><rect x="60" y="415" width="320" height="170" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="78" y="456" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">06 Call protected APIs</text><text x="78" y="492" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">Bearer JWT -&gt; gateway -&gt;</text><text x="78" y="518" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">service security -&gt; project</text><text x="78" y="544" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#23364b" text-anchor="start">permissions.</text><rect x="60" y="700" width="320" height="165" rx="14" fill="#e8f6f1" stroke="#25866b" stroke-width="1.8" /><text x="78" y="741" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Internal requests</text><text x="78" y="776" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">Feign forwards user identity</text><text x="78" y="801" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">and the internal service header.</text><rect x="440" y="700" width="320" height="165" rx="14" fill="#eaf2ff" stroke="#3878c5" stroke-width="1.8" /><text x="458" y="741" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">Public exceptions</text><text x="458" y="776" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">Authentication, published-app</text><text x="458" y="801" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">reads and configured health</text><text x="458" y="826" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">routes.</text><rect x="820" y="700" width="320" height="165" rx="14" fill="#fff0eb" stroke="#bd6142" stroke-width="1.8" /><text x="838" y="741" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23364b" text-anchor="start">External internal paths</text><text x="838" y="776" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">The gateway blocks /internal</text><text x="838" y="801" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#23364b" text-anchor="start">routes from browser callers.</text><line x1="60" y1="968" x2="1140" y2="968" stroke="#dde4ec" /><text x="60" y="1002" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526278" text-anchor="start">JWT = signed user identity. A service key identifies internal callers; it does not replace project permissions.</text></svg>