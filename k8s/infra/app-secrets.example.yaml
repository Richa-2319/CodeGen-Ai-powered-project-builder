# Copy this file outside the repository, replace every value, then apply it.
# Never commit the populated Secret.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: codegen-core
type: Opaque
stringData:
  JWT_SECRET: replace-with-at-least-32-random-bytes
  INTERNAL_SERVICE_KEY: replace-with-an-independent-random-value
  POSTGRES_PASSWORD: replace-me
  ACCOUNT_DB_PASSWORD: replace-me
  WORKSPACE_DB_PASSWORD: replace-me
  INTELLIGENCE_DB_PASSWORD: replace-me
  REDIS_PASSWORD: replace-me
  MINIO_ROOT_USER: replace-me
  MINIO_ROOT_PASSWORD: replace-me
  AI_API_KEY: replace-me
  STRIPE_API_KEY: replace-me
  STRIPE_WEBHOOK_SECRET: replace-me
  CONFIG_GIT_URI: replace-me-if-config-service-is-used
  GIT_USERNAME: replace-me-if-config-service-is-used
  GIT_PASSWORD: replace-me-if-config-service-is-used
