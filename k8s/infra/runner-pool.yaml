apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-pool
  namespace: codegen-previews
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runner
      status: idle
  template:
    metadata:
      labels:
        app: runner
        status: idle
    spec:
      automountServiceAccountToken: false
      activeDeadlineSeconds: 21600
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 1Gi
      containers:
        # 1. THE RUNNER (Vite / Node.js)
        - name: runner
          image: docker.io/library/node:20.19.1-alpine
          workingDir: /app
          command: ["/bin/sh", "-c", "sleep infinity"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /app
          ports:
            - containerPort: 5173
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

        # 2. THE SYNCER (MinIO mc)
        - name: syncer
          image: docker.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
          command: ["/bin/sh", "-c", "sleep infinity"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: MINIO_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MINIO_ROOT_PASSWORD
            # Constructing the host URL for the internal MinIO service
            - name: MC_HOST_myminio
              value: "http://$(MINIO_USER):$(MINIO_PASS)@minio.codegen-core.svc.cluster.local:9000"
          volumeMounts:
            - name: workspace
              mountPath: /app
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
