apiVersion: apps/v1
kind: Deployment
metadata:
  name: codegen-frontend
  namespace: codegen-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codegen-frontend
  template:
    metadata:
      labels:
        app: codegen-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: codegen-frontend
          image: docker.io/richak2319/codegen-frontend:0.0.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: API_GATEWAY_UPSTREAM
              value: http://api-gateway
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: codegen-frontend
  namespace: codegen-core
spec:
  type: ClusterIP
  selector:
    app: codegen-frontend
  ports:
    - port: 80
      targetPort: 8080
