# k8s/proxy/proxy-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: codegen-me-proxy
  namespace: codegen-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codegen-me-proxy
  template:
    metadata:
      labels:
        app: codegen-me-proxy
    spec:
      containers:
        - name: codegen-me-proxy
          image: docker.io/richak2319/codegen-me-proxy:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: codegen-shared-config
          env:
            - name: REDIS_URL
              value: "redis://redis-0.redis.codegen-core.svc.cluster.local:6379"
            - name: PORT
              value: "8080"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: codegen-me-proxy
  namespace: codegen-core
spec:
  selector:
    app: codegen-me-proxy
  ports:
    - port: 80
      targetPort: 8080
