name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test all modules
        run: ./common-lib/mvnw --batch-mode --no-transfer-progress -f pom.xml clean verify
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate frontend
        working-directory: frontend
        run: npm run lint && npm test && npm run build
      - name: Validate preview proxy
        working-directory: k8s/proxy
        run: npm install --ignore-scripts --no-audit --no-fund && node --check index.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline manifest validation tools
        run: |
          python -m pip install --disable-pip-version-check -r k8s/requirements.txt
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/codegen-kubectl"
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl.sha256 -o "$RUNNER_TEMP/codegen-kubectl.sha256"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          tool = Path(os.environ["RUNNER_TEMP"]) / "codegen-kubectl"
          checksum = tool.with_suffix(".sha256").read_text().strip()
          assert hashlib.sha256(tool.read_bytes()).hexdigest() == checksum, "kubectl checksum mismatch"
          tool.chmod(0o755)
          PY
      - name: Validate production and OKE demo manifests without a cluster
        env:
          KUBECONFIG: /dev/null
        run: KUBECTL="$RUNNER_TEMP/codegen-kubectl" python k8s/test_manifests.py
