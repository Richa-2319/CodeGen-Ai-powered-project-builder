services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    mem_limit: 128m
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set the public DNS name pointing to this VM}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend: {condition: service_healthy}

volumes:
  caddy-data:
  caddy-config:
